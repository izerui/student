<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识大厦</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%224%22 width=%2220%22 height=%2224%22 rx=%223%22 fill=%22%231A2433%22/%3E%3Crect x=%2210%22 y=%228%22 width=%2212%22 height=%223%22 fill=%22%23E9AA4C%22/%3E%3Crect x=%2210%22 y=%2214%22 width=%2212%22 height=%223%22 fill=%22%235DBBBE%22/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #F2F4F7; --ink: #1A2433; --muted: #6A7889; --line: #D5DCE5;
    --src: #C77700; --src-bg: #FFF2DC; --src-bd: #E9AA4C;
    --dst: #0F7F86; --dst-bg: #E0F3F2; --dst-bd: #5DBBBE;
    --ease: cubic-bezier(.65, 0, .35, 1);
    --display: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    --body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --mono: "SF Mono", "Menlo", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--body); overflow: hidden; }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--dst); outline-offset: 2px; }
  kbd { font: 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: #fff; }

  header { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: rgba(242,244,247,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); z-index: 10; }
  header h1 { margin: 0; font: 700 23px var(--display); letter-spacing: 6px; cursor: pointer; white-space: nowrap; }
  header .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
  header .tag em { font-style: normal; color: var(--src); font-weight: 600; } header .tag i { font-style: normal; color: var(--dst); font-weight: 600; }
  .grow { flex: 1; }
  .tbtn { height: 34px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; transition: border-color .2s, background .2s; }
  .tbtn:hover { border-color: var(--ink); }
  .tbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #bSearch { width: 230px; color: var(--muted); justify-content: space-between; }

  #bar { position: fixed; top: 56px; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 22px; z-index: 9; white-space: nowrap; overflow-x: auto; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #bar .lead { font-size: 12px; color: var(--muted); background: rgba(242,244,247,.9); padding: 3px 6px; border-radius: 6px; }
  .chip { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
  .chip:hover { border-color: var(--ink); transform: translateY(-1px); }
  .chip.back { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.now { border-color: var(--ink); font-weight: 700; }
  .chip .play { font-size: 9px; margin-right: 5px; color: var(--src); }
  #bar .sep { color: #A9B4C2; font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 2px; margin-right: 4px; }
  .seg button { height: 24px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ink); color: #fff; }
  #legend { position: fixed; left: 18px; bottom: 18px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 520px; font-size: 12px; color: var(--muted); padding: 5px 10px; background: rgba(242,244,247,.9); border-radius: 8px; transition: opacity .3s; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  #cv { position: fixed; top: 56px; left: 0; display: block; touch-action: none; cursor: grab; }
  #cv.grabbing { cursor: grabbing; } #cv.point { cursor: pointer; }
  #formulaLayer { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; z-index: 2; overflow: hidden; pointer-events: none; }
  .canvas-formula { position: absolute; left: 0; top: 0; color: var(--muted); white-space: nowrap; transform-origin: 0 0; will-change: transform, opacity; }
  .canvas-formula .katex { font-size: 12px; line-height: 1; }
  .canvas-formula .katex-display { margin: 0; text-align: left; }

  #mini { position: fixed; right: 64px; bottom: 18px; width: 180px; height: 120px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.85); backdrop-filter: blur(4px); z-index: 5; cursor: crosshair; }
  #zoom { position: fixed; right: 18px; bottom: 18px; z-index: 6; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; box-shadow: 0 4px 14px rgba(26,36,51,.08); }
  #zoom button { width: 34px; height: 34px; border: 0; background: #fff; font-size: 17px; cursor: pointer; color: var(--ink); }
  #zoom button + button { border-top: 1px solid var(--line); }
  #zoom button:hover { background: var(--paper); }
  #help { position: fixed; right: 256px; bottom: 18px; text-align: right; font-size: 11.5px; color: var(--muted); z-index: 5; line-height: 1.8; background: rgba(242,244,247,.85); padding: 2px 8px; border-radius: 8px; }
  #help kbd { margin: 0 2px; }
  #mini, #help { transition: opacity .4s; }
  #mini.hide, #help.gone { opacity: 0; pointer-events: none; }

  #tip { position: fixed; z-index: 20; pointer-events: none; max-width: min(620px, calc(100vw - 40px)); background: var(--ink); color: #fff; font-size: 13px; line-height: 1.7; border-radius: 14px; opacity: 0; transition: opacity .15s; box-shadow: 0 10px 28px rgba(26,36,51,.25); overflow: visible; }
  #tip.show { pointer-events: auto; opacity: 1; }
  #tip .tip-inner { padding: 18px 24px; max-height: calc(100vh - 80px); overflow-y: auto; border-radius: 14px; }
  #tip::after { content: ""; position: absolute; width: 14px; height: 14px; background: var(--ink); transform: rotate(45deg); pointer-events: none; }
  #tip.arrow-left::after { left: -7px; top: var(--arrow-y, 24px); }
  #tip.arrow-right::after { right: -7px; top: var(--arrow-y, 24px); }
  #tip.arrow-top::after { top: -7px; left: 40px; }
  #tip:not(.arrow-left):not(.arrow-right):not(.arrow-top)::after { display: none; }
  #tip.show h3 { color: #B8C3D1; font-size: 11px; letter-spacing: 2px; font-weight: 600; margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); }
  #tip.show p { font-size: 13px; line-height: 1.7; margin: 4px 0; }
  #tip.show .proof { margin: 6px 0 2px; }
  #tip.show .proof-step { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 13px; line-height: 1.8; }
  #tip.show .proof-step:last-child { border-bottom: none; }
  #tip.show .proof-step .sn { width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: rgba(255,255,255,.15); color: #B8C3D1; font: 600 11px var(--mono); flex: none; }
  #tip.show .proof-step .katex { font-size: 1.05em; white-space: nowrap; }
  #tip.show .dep-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.12); }
  #tip.show .dep-block:first-child { margin-top: 4px; padding-top: 0; border-top: none; }
  #tip.show .dep-flow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  #tip.show .dep-flow .lk { font-size: 12px; font-weight: 600; padding: 2px 8px; }
  #tip.show .dep-flow .arrow { color: #5DBBBE; font-size: 14px; }
  #tip.show .dep-src { font-size: 12px; color: #B8C3D1; margin-bottom: 4px; }
  #tip.show .tip-cond { color: #FFD08A; font-size: 12px; margin: 5px 0; padding: 4px 8px; background: rgba(255,208,138,.08); border-radius: 4px; }
  #tip.show .tip-method { color: #5DBBBE; font-weight: 700; font-size: 13px; margin: 5px 0; }
  #tip.show .route { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 12px; margin: 4px 0; }
  #tip.show .route .ar { color: #FFD08A; }
  #tip.show .route .here { background: #fff; color: var(--ink); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 600; }
  #tip.show .lk { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.15); cursor: pointer; color: #fff; margin: 1px 0; }
  #tip.show .lk:hover { background: rgba(255,255,255,.3); }
  #tip.show .hero-formula { margin: 8px 0; padding: 12px 16px; background: rgba(255,255,255,.14); border-left: 3px solid #5DBBBE; border-radius: 0 8px 8px 0; font-size: 15px; }
  #tip.show .hero-formula .katex { font-size: 1.1em; white-space: nowrap; }
  #tip.show .kd { font-size: 10px; padding: 0 4px; border-radius: 3px; background: rgba(255,255,255,.15); }
  #tip.show .md { color: #5DBBBE; font-size: 12px; font-weight: 600; }
  #tip.show { opacity: 1; transform: none; }
  #tip small { color: #B8C3D1; display: block; margin: 2px 0; }
  #tip .rel { color: #FFD08A; display: block; margin-top: 4px; }

  #caption { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 100px); display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(26,36,51,.16); padding: 0; z-index: 12; opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s var(--ease); }
  #caption.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #caption .top { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); padding: 14px 18px 0; flex: none; }
  #caption .dots { display: flex; gap: 5px; }
  #caption .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
  #caption .dots i.on { background: var(--src-bd); }
  #caption .txt { margin: 8px 0 0; font-size: 15px; line-height: 1.7; min-height: 32px; overflow-y: auto; padding: 0 18px; }
  #caption .txt b { font-family: var(--display); font-size: 18px; }
  #caption .txt .ar { color: var(--src); margin: 0 6px; }
  #caption .ctrl { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px 12px; flex: none; }
  #caption .ctrl button { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 12.5px; }
  #caption .ctrl button:hover:not(:disabled) { border-color: var(--ink); }
  #caption .ctrl button:disabled { opacity: .4; cursor: default; }
  #caption .ctrl .main { margin-left: auto; background: var(--ink); color: #fff; border-color: var(--ink); }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  @media (max-width: 900px) {
    }

  #palette { position: fixed; inset: 0; background: rgba(26,36,51,.28); backdrop-filter: blur(2px); z-index: 30; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
  #palette.show { display: flex; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  #palette .box { width: min(560px, calc(100vw - 24px)); background: #fff; border-radius: 16px; box-shadow: 0 30px 80px rgba(26,36,51,.3); overflow: hidden; animation: pop .25s var(--ease); }
  @keyframes pop { from { transform: translateY(-8px) scale(.98); opacity: 0; } }
  #palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 18px 20px; font: 17px var(--body); outline: none; color: var(--ink); }
  #palette .res { max-height: 52vh; overflow-y: auto; padding: 6px; }
  #palette .it { display: grid; grid-template-columns: 42px 1fr auto; gap: 2px 10px; align-items: baseline; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
  #palette .it.act { background: var(--paper); }
  #palette .it .id { font: 11px var(--mono); color: var(--muted); }
  #palette .it b { font-size: 14px; }
  #palette .it small { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
  .fm-script { font-family: var(--body); font-size: .76em; line-height: 0; }
  sup.fm-script { vertical-align: .55em; }
  sub.fm-script { vertical-align: -.18em; }


  #palette .it i { font-style: normal; font-size: 11px; }
  #palette .head { font-size: 11px; color: var(--muted); letter-spacing: 2px; padding: 8px 12px 4px; }
  #palette .foot { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; }

  .splash { position: fixed; inset: 0; overflow-y: auto; padding: 12vh 40px 40px; background: var(--paper); }
  .splash h2 { font: 700 26px var(--display); margin: 0 0 10px; }
  .splash p { font: 15px var(--body); margin: 0 0 14px; }
  .splash ul { font: 13px/1.8 var(--mono); color: #B23B3B; max-width: 900px; }
  #bar .div { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
  #bar .chip.mth { color: var(--dst); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 900px) {
    header { gap: 8px; padding: 0 10px; }
    header h1 { font-size: 19px; letter-spacing: 3px; }
    header .tag, #mini, #help, #legend { display: none; }
    #bSearch { width: auto; flex: 1; }
    #bar { padding: 0 10px; }
    }
</style>

plwdzglfj"},{"id":"5.3.2","name":"概率的运算性质","full":"概率的运算性质","one":"$0 \\leqslant P \\left( A \\right) \\leqslant 1 \\text{；互斥时} P \\left( A \\cup B \\right) = P \\left( A \\right) + P \\left( B \\right) \\text{；} P \\left( \\bar{ A } \\right) = 1 - P \\left( A \\right)$","stage":"高中","layer":5,"region":"随机","group":"5.3","what":"必然事件的概率为 1，不可能事件为 0；A、B 互斥时 P(A∪B)=P(A)+P(B)；对立事件 P(Ā)=1−P(A)；一般情况下 P(A∪B)=P(A)+P(B)−P(AB)。","eg":"抛 3 次硬币，P(至少一次正面)=1−P(全是反面)=1−1/8=7/8。","from":"由 频率与概率（5.3.1）（频率满足这些性质，概率也照样满足）；用到 事件的关系与运算（3.6.2）（互斥、对立、和事件、积事件）","deps":[{"id":"5.3.1","kind":"推出","how":"频率满足这些性质，概率也照样满足"},{"id":"3.6.2","kind":"用到","how":"互斥、对立、和事件、积事件"}],"_pyN":"gldysxz","_pyX":"$0 \\leqslant p \\left( a \\right) \\leqslant 1 \\text{；hcs} p \\left( a \\cup b \\right) = p \\left( a \\right) + p \\left( b \\right) \\text{；} p \\left( \\bar{ a } \\right) = 1 - p \\left( a \\right)$"},{"id":"5.4","name":"古典概型","full":"古典概型","one":"$P \\left( A \\right) = \\frac{ \\text{有利结果数} }{ \\text{总结果数} }$","stage":"高中","layer":5,"region":"随机","what":"如果试验的结果只有有限个，并且每个结果出现的可能性相同，那么事件 A 的概率＝A 包含的结果数÷全部结果数。例如掷两枚骰子共有 6×6=36 种结果，点数和为 7 的有 (1,6)、(2,5)…(6,1) 共 6 种，概率是 6/36=1/6。","next":"结果无限多或不等可能时，就要用随机变量（5.6）和分布来描述。","use":"抽签是否公平（每个人抽中的概率都相同）；扑克、麻将等游戏的概率计算；抽奖活动的中奖率。掷骰子、摸球这类等可能问题。","eg":"掷两枚骰子，点数和为 7 的概率为 6/36=1/6。","from":"在概率的基本性质（5.3）下，“等可能”让概率变成了“数个数”的问题；结果多的时候，要靠排列组合（5.1）来数。","points":["结果有限、每个结果等可能时，P(A) = A 包含的结果数 / 总结果数。"],"deps":[{"id":"5.3.2","kind":"用到","how":"等可能时数个数"},{"id":"5.1.1","kind":"用到","how":"用排列数数结果"},{"id":"5.1.2","kind":"用到","how":"用组合数数结果"}],"_pyN":"gdgx","_pyX":"$p \\left( a \\right) = \\frac{ \\text{yljgs} }{ \\text{zjgs} }$"},{"id":"5.5.1","name":"条件概率与乘法公式","full":"条件概率与乘法公式","one":"$P \\left( B \\mid A \\right) = \\frac{ P \\left( A B \\right) }{ P \\left( A \\right) } \\text{（} P \\left( A \\right) > 0 \\text{）；} P \\left( A B \\right) = P \\left( A \\right) P \\left( B \\mid A \\right)$","stage":"高中","layer":5,"region":"随机","group":"5.5","what":"已知 A 发生的条件下 B 发 ":"随机","what":"把每个试验结果对应成一个数，这个数就叫随机变量；把它可能取的每个值和对应概率列成表，就是分布列。例如掷骰子的点数 X 可以取 1～6，每个值的概率都是 1/6。","next":"有了数，就能算平均水平和波动——期望与方差（5.7）；常见的分布有二项分布（5.8）、正态分布（5.9）；大学推广到连续取值的随机变量（7.9）。","use":"保险公司统计每份保单的赔付金额；商店统计每天的顾客人数；游戏中每局的得分。","eg":"掷骰子的点数 X，P(X=k)=1/6（k=1,…,6）。","from":"随机变量本质上是一个函数（3.1）：自变量是样本点，函数值是实数；每个取值的概率由概率的基本性质（5.3）确定，所有概率加起来等于 1。","points":["把每个试验结果对应一个数（本质是函数），列出取每个值的概率。"],"deps":[{"id":"3.1.1","kind":"用到","how":"样本点对应实数"},{"id":"5.3.2","kind":"用到","how":"每个取值都有概率，加起来是 1"}],"_pyN":"sjblyfbl","_pyX":"$p \\left( x = x _{ i } \\right) = p _{ i } \\text{，} \\sum p _{ i } = 1$"},{"id":"5.7.1","name":"均值（期望）","full":"均值（期望）","one":"$E \\left( X \\right) = \\sum x _{ i } p _{ i } \\text{；} E \\left( a X + b \\right) = a E \\left( X \\right) + b$","stage":"高中","layer":5,"region":"随机","group":"5.7","what":"离散型随机变量的每个取值乘以它的概率再相加，是概率意义下的平均值；线性变换 aX+b 的期望是 aE(X)+b。","eg":"掷骰子点数的期望是 (1+2+…+6)/6=3.5。","from":"由 随机变量与分布列（5.6）（按分布列加权求平均）","deps":[{"id":"5.6","kind":"推出","how":"按分布列加权求平均"}],"_pyN":"jz（qw）","_pyX":"$e \\left( x \\right) = \\sum x _{ i } p _{ i } \\text{；} e \\left( a x + b \\right) = a e \\left( x \\right) + b$"},{"id":"5.7.2","name":"方差与标准差","full":"方差与标准差","one":"$D \\left( X \\right) = \\sum \\left( x _{ i } - E \\left( X \\right) \\right) ^{ 2 } p _{ i } \\text{；} D \\left( a X + b \\right) = a ^{ 2 } D \\left( X \\right)$","stage":"高中","layer":5,"region":"随机","group":"5.7","what":"取值与期望之差的平方按概率加权平均，衡量取值的分散程度；标准差是方差的算术平方根，和 X 的单位相同；也可以用 D(X)=E(X²)−(E(X))² 计算。","eg":"掷骰子点数的方差是 91/6−3.5²=35/12≈2.92。","from":"由 均值（期望）（5.7.1）（偏离期望的平方再求期望）；用到 平方非负（2.4）（平方非负，偏离不会正负抵消）","deps":[{"id":"5.7.1","kind":"推出","how":"偏离期望的平方再求期望"},{"id":"2.4","kind":"用到","how":"平方非负，偏离不会正负抵消"}],"_pyN":"fcybzc","_pyX":"$d \\left( x \\right) = \\sum \\left( x _{ i } - e \\left( x \\right) \\right) ^{ 2 } p _{ i } \\text{；} d \\left( a x + b \\right) = a ^{ 2 } d \\left( x \\right)$"},{"id":"5.8.1","name":"二项分布","full":"二项分布","one":"$P \\left( X = k \\right) = C _{ n } ^{ k } p ^{ k } \\ 接近”，说不清楚、也没法用来严格证明。大学用逻辑里的“任意”“存在”（0.1）、用绝对值表示距离（1.7）、依靠实数的连续性（1.4），把它写成了精确的定义。","points":["用“对任意 ε>0，存在 δ>0……”精确说明“无限接近”。"],"deps":[{"id":"6.1","kind":"推广","how":"把“无限接近”说严格"},{"id":"0.1.3","kind":"用到","how":"用“任意”“存在”下定义"},{"id":"1.4","kind":"用到","how":"实数连续保证极限存在"},{"id":"1.7.2","kind":"用到","how":"接近写成 |x−a|\u003cδ"}],"_pyN":"ε-δ jxylxjxylxdygdy（ε-δ）","_pyX":"$\\forall \\epsilon > 0 \\exists \\delta > 0 \\text{：b“wxjj”syg}$"},{"id":"7.2.1","name":"中值定理","full":"中值定理","one":"$f \\left( b \\right) - f \\left( a \\right) = f ' \\left( \\xi \\right) \\left( b - a \\right) \\text{，} \\xi \\text{在} a \\text{、} b \\text{之间}$","stage":"大学","layer":7,"region":"变化","group":"7.2","what":"f 在 [a,b] 上连续、在 (a,b) 内可导时，至少有一点 ξ，那里的切线平行于连接两端的弦；用它可以严格证明高中直接承认的“导数为正则递增”。","eg":"开车 1 小时走了 60 公里，速度连续变化，途中一定有某一刻速度表正好指在 60。","from":"推广自 导数与单调性（6.4.1）（高中承认的“导数为正则递增”在此严格证明）；用到 ε-δ 极限与连续（7.1）（用严格的极限与连续定义来证明）","deps":[{"id":"6.4.1","kind":"推广","how":"高中承认的“导数为正则递增”在此严格证明"},{"id":"7.1","kind":"用到","how":"用严格的极限与连续定义来证明"}],"_pyN":"zzdl","_pyX":"$f \\left( b \\right) - f \\left( a \\right) = f ' \\left( \\xi \\right) \\left( b - a \\right) \\text{，} \\xi \\text{z} a \\text{、} b \\text{zj}$"},{"id":"7.2.2","name":"泰勒展开","full":"泰勒展开","one":"$f \\left( x \\right) \\approx f \\left( a \\right) + f ' \\left( a \\right) \\left( x - a \\right) + f '' \\left( a \\right) \\frac{ \\left( x - a \\right) ^{ 2 } }{ {2 !} } + \\cdots$","stage":"大学","layer":7,"region":"变化","group":"7.2","what":"用多项式逼近复杂函数：只取一阶就是用切线近似曲线，项取得越多越准确，误差可以用中值定理的推广来估计。","eg":"x 很小时 eˣ≈1+x+x²/2，sinx≈x。","from":"推广自 中值定理（7.2.1）（中值定理推广到高阶导数）；推广自 导数的几何意义（6.2.3）（一阶就是用切线近似曲线）","deps":[{"id":"7.2.1","kind":"推广","how":"中值定理推广到高阶导数"},{"id":"6.2.3","kind":"推广","how":"一阶就是用切线近似曲线"}],"_pyN":"tlzk","_pyX":"$f \\left( x \\right) \\approx f \\left( a \\right) + f ' \\left( a \\right) \\left( x - a \\right) + f '' \\left( a \\right) \\frac{ \\left( x - a \\right) ^{ 2 } }{ {2 !} } + \\cdots$"},{"id":"7.3","name":"积分学","full":"积分学","one":"换元、分部积分；面积、体积、功","stage":"大学","layer":7,"region":"变化","what":"系统学习怎样找原函数：换元法（把复杂部分看成一个新变量）、分部积分法（把乘积拆开处理）等；并把定积分用到面积、体积、曲线长度、质心、做功等各种“累积”问题上。例如 ∫eˣdx＝eˣ+C。","next":"推广到多个变量就是重积分（7.5）；它是解微分方程（7.6）的基本工具；概率论里用它计算连续型随机变量的概率和期望（7.9）。","use":"计算不规则零件的体积和重量、卫星轨道上引力做的功、血药浓度—时间曲线下的面积（反映药物在体内的总暴露量）。物理中求位移、功、质心。","eg":"∫ eˣ dx = eˣ + C。","from":"高中的定积分（6.5）只处理简单函数；遇到复杂函数找不到原函数，就需要一整套方法，这就是积分学。","points":["不定积分（求原函数）的方法（换元、分部）；定积分的应用（面积、体积、弧长）。"],"deps":[{"id":"6.5.2","kind":"推广","how":"复杂函数需要积分方法"}],"_pyN":"jfx","_pyX":"hy、fbjf；mj、tj、g"},{"id":"7.4","name":"级数","full":"级数（无穷多项相加）","one":"$\\sum a _{ n } \\text{：无穷多项相加}$","stage":"大学","layer":7,"region":"变化","what":"把无穷多个数一个接一个加下去，有时会得到一个确定的数，有时会越加越大。例如 1+1/2+1/4+1/8+…＝2；而 1+1/2+1/3+1/4+… 却会无限增大。级数研究的就是“什么时候加得出结果、结果是多少”。","next":"用无穷多项多项式表示函数（泰勒级数，与 7.2 相连），用无穷多个正弦波表示任意周期信号（傅里叶级数）；为微分方程（7.6）提供求解方法。","use":"音乐和图像压缩（MP3、JPEG）把信号拆成很多正弦波的和；计算机计算 π、e 的数值；“芝诺悖论”中追乌龟的问题也用级数解释。","eg":"1 + 1/2 + 1/4 + … = 2。","from":"等比数列求和公式（4.16）里，让项数趋于无穷就得到第一个级数；要判断一般的无穷和是否有极限，需要严格的极限定义（7.1）。","points":["研究无穷多项相加的和是否存在、等于多少。"],"deps":[{"id":"4.16.4","kind":"推广","how":"等比求和让项数趋于无穷"},{"id":"7.1","kind":"用到","how":"判断无穷和是否收敛"}],"_pyN":"jsjs（wqdxxj）","_pyX":"$\\sum a _{ n } \\text{：wqdxxj}$"},{"id":"7.5","name":"多元微积分","full":"多元微积分","one":"$\\text{偏导数 }\\frac{\\partial f}{\\partial x}，\\text{重积分}$","stage":"大学","layer":7,"region":"变化","what":"当一个量同时依赖好几个量时，比如山的高度随东西、南北两个方向变化，就分别看“只沿一个方向走”时的变化率（偏导数）；求立体的体积、质量，就在平面或空间区域上积分（重积分）。例如 f(x,y)＝x²+y² 在原点取最小值。","next":"进一步发展成场论、微分几何，是电磁学、流体力学、相对论的数学语言。","use":"天气预报中气温随位置和时间的变化、建筑结构的受力分析、机器学习中沿着“最陡下降方向”调整参数（梯度下降）。求曲面上的最值、立体的质量与体积，描述物理场。","eg":"f(x,y)=x²+y² 在原点取最小值。","from":"一元的中值定理与泰勒展开（7.2）、一元的积分（7.3）推广到多个变量；需要空间直角坐标（4.11）来描述多元函数和空间区域。","points":["多个变量的函数的偏导数、重积分。"],"deps":[{"id":"7.2.1","kind":"推广","how":"一个变量推广到多个"},{"id":"7.3","kind":"推广","how":"一元积分推广到重积分"},{"id":"4.11.1","kind":"用到","how":"用空间坐标描述区域"}],"_pyN":"dywjf","_pyX":"$\\text{pds }\\frac{\\partial f}{\\partial x}，\\text{zjf}$"},{"id":"7.6","name":"微分方程","full":"微分方程","one":"$\\text{如} y ' = k y \\implies y = C e ^{ k x }$","stage":"大学","layer":7,"region":"变化","what":"含有未知函数和它的导数的方程，解出来的是一个函数。例如“人口增长速度和人口数量成正比”写成 y′＝ky，它的解是 y＝Ceᵏˣ，也就是指数增长（k\u003c0 时是指数衰减）。","next":"是物理、工程、生物、经济建模（8.1）的核心工具；进一步发展成偏微分方程、动力系统。","use":"预测行星和卫星的轨道、放射性物质的衰变（碳-14 测年）、传染病的传播曲线、电路中电流的变化。","eg":"$y'=ky$ 的解是 $y=Ce^{kx}$（指数增长与衰减）。","from":"很多自然规律说的是“变化率等于什么”，例如牛顿第二定律说加速度（位移的二阶导数）等于力除以质量。要从“变化的规律”反推出“量本身”，就要用求导公式（6.3）和积分（7.3）来解方程。","points":["含有未知函数及其导数的方程；解出来的是一个函数。"],"deps":[{"id":"6.3.1","kind":"用到","how":"求导写出变化规律"},{"id":"7.3","kind":"用到","how":"积分把规律还原成函数"}],"_pyN":"wffc","_pyX":"$\\text{r} y ' = k y \\implies y = c e ^{ k x }$"},{"id":"7.7.1","name":"矩阵及其运算","full":"矩阵及其运算","one":"矩阵的加法、数乘、乘法 $AB$（一般 $AB\\ne BA$）；$n$ 维向量","stage":"大学","layer":7,"region":"形","group":"7.7","what":"把数排成矩形的表叫矩阵；矩阵可以相加、数乘，A 的列数等于 B 的行数时可以相乘，乘法一般不满足交换律；向量从二维、三维推广到 n 维，就是只有一行或一列的矩阵。","eg":"第一行 (1, 2)、第二行 (3, 4) 的矩阵乘列向量 (1, 1)，得到列向量 (3, 7)。","from":"推广自 向量的坐标运算（3.3.4）（向量的坐标运算推广到 n 维）","deps":[{"id":"3.3.4","kind":"推广","how":"向量的坐标运算推广到 n 维"}],"_pyN":"jzjqys","_pyX":"jzdjf、sc、cf $ab$（yb $ab\\ne ba$）；$n$ wxl"},{"id":"7.7.2","name":"线性方程组","full":"线性方程组","one":"$A x = b \\text{；高斯消元法}$","stage":"大学","layer":7,"region":"形","group":"7.7","what":"把方程组的系数写成矩阵 A，方程组就是 Ax=b；用高斯消元法化成阶梯形，判断无解、唯一解还是无穷多解，并求出解。","eg":"x+y=5，x−y=1 写成 Ax=b，消元得 x=3，y=2。","from":"推广自 一次方程与方程组（2.2.2）（初中的消元法推广到任意多个方程）；用到 矩阵及其运算（7.7.1）（用矩阵表示方程组）","deps":[{"id":"2.2.2","kind":"推广","how":"初中的消元法推广到任意多个方程"},{"id":"7.7.1","kind":"用到","how":"用矩阵表示方程组"}],"_pyN":"xxfcz","_pyX":"$a x = b \\text{；gsxyf}$"},{"id":"7.8","name":"线性变换与特征值","full":"线性变换与特征值","one":"$A v = \\lambda v \\text{（} v \\ne 0 \\text{）：变换后与原向量共线}$","stage":"高中·拓展→大学","layer":7,"region":"形","what":"用矩阵表示平面或空间的旋转、伸缩、投影；特征向量是变换以后仍与原来共线、只被拉长、缩短或反向的非零向量。例如矩阵 [[cosθ, −sinθ],[sinθ, cosθ]] 把平面上的每个点绕原点旋转 θ 角。","next":"大学里的振动分析、量子力学、数据降维（主成分分析）都离不开特征值。","use":"图片的旋转缩放、三维游戏的视角变换、搜索引擎给网页排序、桥梁和建筑的振动分析。","eg":"矩阵 [[cosθ, −sinθ],[sinθ, cosθ]] 把平面旋转 θ 角。","from":"由矩阵（7.7）推出；复数乘法表示旋转（4.15）是它的一个特例；初中的图形变换（1.8）在这里统一写成矩阵运算。","points":["矩阵表示平面或空间的旋转、伸缩、投影；特征向量是变换后与原向量共线的非零向量（λ\u003c0 时方向相反）。"],"deps":[{"id":"7.7.1","kind":"推出","how":"矩阵表示变换"},{"id":"4.15.3","kind":"推广","how":"复数乘法推广为矩阵变换"},{"id":"1.8.2","kind":"推广","how":"旋转写成矩阵，推广到伸缩、投影"}],"_pyN":"xxbhytzz","_pyX":"$a v = \\lambda v \\text{（} v \\ne 0 \\text{）：bhhyyxlgx}$"},{"id":"7.9","name":"连续型随机变量","full":"概率论：连续型随机变量与分布函数","one":"$P \\left( a \u003c X \u003c b \\right) = \\int _{ a } ^{ b } f \\left( x \\right) {\\text{d}x}$","stage":"大学","layer":7,"region":"随机","what":"有些随机量可以取一段区间里的任意值，比如等车的时间、灯泡的寿命，这叫连续型随机变量。它落在某个区间的概率，等于密度曲线在这段区间下方的面积。","next":"中心极限定理的极限分布是连续的正态分布，要靠它来描述（7.10）。","use":"电子元件寿命（指数分布）、排队等待时间、金融中股票价格的变化模型。","eg":"正态分布在 [μ−σ, μ+σ] 上的概率约为 0.683。","from":"把高中的分布列（5.6）推广到连续取值：取每一个具体值的概率都是 0，只能讨论“落在一个区间里”的概率；而“曲线下的面积”正是积分（7.3）。","points":["用概率密度和分布函数描述连续取值的随机变量；概率是密度曲线下的面积（积分）。"],"deps":[{"id":"5.6","kind":"推广","how":"推广到连续取值"},{"id":"7.3","kind":"用到","how":"概率＝曲线下面积"}],"_pyN":"lxxsjblgll：lxxsjblyfbhs","_pyX":"$p \\left( a \u003c x \u003c b \\right) = \\int _{ a } ^{ b } f \\left( x \\right) {\\text{d}x}$"},{"id":"7.10.1","name":"大数定律","full":"大数定律","one":"$n$ 很大时，频率 $\\to$ 概率，样本平均 $\\to$ 期望","stage":"大学","layer":7,"region":"随机","group":"7.10","what":"独立重复试验的次数越多，事件发生的频率越接近它的概率；独立同分布的随机变量，平均值越接近期望。它把高中“频率稳定于概率”的经验事实变成了定理。","eg":"抛硬币 10000 次，正面的频率很接近 0.5。","from":"由 均值（期望）（5.7.1）（平均值趋向期望）；用到 方差与标准差（5.7.2）（用方差控制偏离程度）；推广自 二项分布（5.8.1）（伯努利最早证明的是二项分布的情形）","deps":[{"id":"5.7.1","kind":"推出","how":"平均值趋向期望"},{"id":"5.7.2","kind":"用到","how":"用方差控制偏离程度"},{"id":"5.8.1","kind":"推广","how":"伯努利最早证明的是二项分布的情形"}],"_pyN":"dsdl","_pyX":"$n$ hds，pl $\\to$ gl，ybpj $\\to$ qw"},{"id":"7.10.2","name":"中心极限定理","full":"中心极限定理","one":"大量独立随机变量的和近似服从正态分布","stage":"大学","layer":7,"region":"随机","group":"7.10","what":"很多个独立的随机因素加在一起，不论每个因素服从什么分布（只要方差有限），总和（标准化后）都近似服从正态分布；n 很大时二项分布接近正态分布，就是它的特例。","eg":"身高、测量误差都受许多微小因素共同影响，所以近似服从正态分布。","from":"推广自 二项分布（5.8.1）（棣莫弗、拉普拉斯先证明了二项分布的情形）；用到 正态分布（5.9）（极限是正态分布）；用到 连续型随机变量（7.9）（正态分布是连续型随机变量）；与 7.10.1（同样研究大量独立随机变量，对照着看）","deps":[{"id":"5.8.1","kind":"推广","how":"棣莫弗、拉普拉斯先证明了二项分布的情形"},{"id":"5.9","kind":"用到","how":"极限是正态分布"},{"id":"7.9","kind":"用到","how":"正态分布是连续型随机变量"},{"id":"7.10.1","kind":"对照","how":"同样研究大量独立随机变量，对照着看"}],"_pyN":"zxjxdl","_pyX":"dldlsjbldhjsfcztfb"},{"id":"7.11.1","name":"参数估计","full":"参数估计","one":"点估计；置信区间：$\\text{估计值}\\pm\\text{误差范围}$","stage":"大学","layer":7,"region":"随机","group":"7.11","what":"用样本算出总体参数的估计值（点估计），再按一定的把握程度（如 95%）给出一个区间（区间估计），说明总体参数大概在什么范围内。","eg":"随机调查 1000 人，支持率 52%，按 95% 的把握，误差约 ±3%。","from":"推广自 用样本估计总体（5.10.4）（用样本估计总体，再加上误差范围）；由 大数定律（7.10.1）（样本平均会接近总体期望）；由 中心极限定理（7.10.2）（样本平均近似正态，能算出误差范围）","deps":[{"id":"5.10.4","kind":"推广","how":"用样本估计总体，再加上误差范围"},{"id":"7.10.1","kind":"推出","how":"样本平均会接近总体期望"},{"id":"7.10.2","kind":"推出","how":"样本平均近似正态，能算出误差范围"}],"_pyN":"csgj","_pyX":"dgj；zxqj：$\\text{gjz}\\pm\\text{wcfw}$"},{"id":"7.11.2","name":"假设检验","full":"假设检验","one":"先假设，再看样本在假设下是否极不可能，决定是否拒绝","stage":"大学","layer":7,"region":"随机","group":"7.11","what":"先提出一个假设（如“新药无效”），计算在这个假设下出现眼前这样或更极端的数据有多大可能；可能性小于事先定好的标准（如 5%），就拒绝这个假设。判断可能出错，所以结论都带着犯错的概率。","eg":"新药组的有效率明显高于安慰剂组，在“新药无效”的假设下出现这么大或更大差距的概率小于 1%，于是认为新药有效。","from":"推广自 独立性检验（5.11.3）（独立性检验就是一种假设检验）；由 中心极限定理（7.10.2）（用正态分布算出“极不可能”的标准）","deps":[{"id":"5.11.3","kind":"推广","how":"独立性检验就是一种假设检验"},{"id":"7.10.2","kind":"推出","how":"用正态分布算出“极不可能”的标准"}],"_pyN":"jsjy","_pyX":"xjs，zkybzjsxsfjbkn，jdsfjj"},{"id":"8.1","name":"数学建模与探究","full":"数学建模与探究","one":"实际问题 → 模型 → 求解 → 检验","stage":"高中→终身","layer":8,"region":"建模","what":"从一个实际问题出发，抓住主要因素、忽略次要因素，把它写成数学模型（函数、方程、不等式、概率模型……），求解后回到现实检验：符合就用，不符合就修改模型，再算一遍。探究则是“观察—猜想—证明”的研究过程。","next":"这是数学走出课本的出口：大学的数学建模、运筹学、数据科学、人工智能都从这里出发，并且会伴随一生的工作和生活。","use":"例：根据某城市近十年的人口数据选用指数模型预测未来人口，再用新数据检验、修正。药物剂量设计、交通信号配时、工程优化、疫情与气候模型、贷款利率与方案比较，都是数学建模。","eg":"根据某城市近十年人口数据，选择指数模型预测未来人口，再用新数据检验、修正。","from":"大厦里各部分都提供了现成的模型：函数模型（4.18）描述增长，正弦型函数（4.7）描述周期现象，解三角形（4.8）用于测量，数列（4.16）用于分期付款和逐年增长，均值不等式（2.6）和导数（6.4）用于求最优，回归分析（5.11）用于根据数据预测。建模就是把它们用回现实。","points":["从实际问题出发，抓住主要因素，用数学语言写成模型，求解后回到现实检验，不合适就修改模型。探究是从观察、猜想到证明的研究过程。"],"deps":[{"id":"4.18.2","kind":"用到","how":"增长模型"},{"id":"4.7.3","kind":"用到","how":"周期现象模型"},{"id":"4.8.4","kind":"用到","how":"测量模型"},{"id":"6.4.4","kind":"用到","how":"求最优方案"},{"id":"5.11.2","kind":"用到","how":"根据数据预测"},{"id":"2.6.2","kind":"用到","how":"不用导数求最值"},{"id":"4.16.4","kind":"用到","how":"分期付款与逐年增长"}],"_pyN":"sxjmytj","_pyX":"sjwt → mx → qj → jy"}],"groups":[{"id":"0.1","name":"逻辑","full":"逻辑","stage":"初中→高中","one":"若p则q；充分、必要；任意、存在","what":"推理的规则：“如果 p，那么 q”是什么意思；什么叫充分条件、必要条件；“任意”和“存在”怎么用；一句话的否定怎么写。例如“x=1”能推出“x²=1”，反过来不行（x 也可以是 −1），所以“x=1”是“x²=1”的充分不必要条件。","next":"证明方法（0.3）、数学归纳法（0.4）都要按逻辑规则来推；大学里把“无限接近”说严格（7.1），靠的正是“任意”“存在”这两个词。","use":"律师辩论、法官判案要讲逻辑；写程序时的“如果……就……”判断；看广告、新闻时识别“偷换条件”的说法。数学里，它让每个命题写清楚条件和结论，为后面所有证明提供规则。","eg":"“x=1”是“x²=1”的充分不必要条件。","from":"它是整座大厦的出发点：要判断一个推理对不对，总得有规则，而规则本身没法再用别的数学去证明，只能大家约定、直接承认。","points":["推理的规则。“若 p 则 q”、充分条件与必要条件、“任意”“存在”、命题的否定。"],"_pyN":"lj","_pyX":"rpzq；cf、by；ry、cz"},{"id":"0.2","name":"集合","full":"集合","stage":"高中","one":"$A\\cap B、A\\cup B、\\complement_U A；\\text{子集 }A\\subseteq B$","what":"把一些研究对象放在一起看，就是集合；常用的运算有交集（共同的部分）、并集（合在一起）、补集（剩下的部分）。例如方程 x²=1 的解集是 {−1, 1}。","next":"函数（3.1）的定义域、值域是集合；随机事件（3.6）就是样本空间的子集；曲线（3.9）是满足条件的点组成的集合；“p 是 q 的充分条件”就是 p 的集合包含于 q 的集合。","use":"数据库按条件筛选数据（交、并）；搜索引擎里的“同时包含”“或者包含”；统计问卷中“既喜欢 A 又喜欢 B”的人数。","eg":"方程 x²=1 的解集是 {−1, 1}。","from":"数学需要一种共同的语言来说“哪些东西”，集合就是这种最基本的语言，直接承认它的概念，作为地基。","points":["把研究对象放在一起看的语言。元素、子集、交集、并集、补集。"],"_pyN":"jh","_pyX":"$a\\cap b、a\\cup b、\\complement_u a；\\text{zj }a\\subseteq b$"},{"id":"0.3","name":"证明方法","full":"证明方法","stage":"初中→高中","one":"综合法、分析法、反证法","what":"由已知推出结论的几种思路：综合法从条件出发一步步推到结论（由因导果）；分析法从结论出发，反过来找“要它成立需要什么”（执果索因）；反证法先假设结论不成立，推出矛盾，从而说明结论成立。例如用反证法证明 √2 不是分数。","next":"大厦里所有的定理——不等式的性质（2.3）、几何定理（4.9）、导数的结论（6.4）——都是用这几种方法证明的。","use":"侦探推理（排除不可能的情况）；工程中的故障排查（从结果倒推原因）；辩论中指出对方说法会导致矛盾。数学里用来证明定理，判断一个结论是否一定成立。","eg":"用反证法证明 √2 不是有理数。","from":"这些方法都是按照逻辑（0.1）的规则组织推理：反证法用的就是“一个命题与它的否定不能同时成立”。","points":["由已知推出结论的几种方式。综合法（由因导果）、分析法（执果索因）、反证法（假设结论不成立，推出矛盾）。"],"_pyN":"zmff","_pyX":"zhf、fxf、fzf"},{"id":"0.5","name":"计数原理","full":"计数原理","stage":"小学直觉→高中","one":"$\\text{分类} N = m _{ 1 } + m _{ 2 } \\text{，分步} N = m _{ 1 } \\cdot m _{ 2 }$","what":"完成一件事，如果有几类办法、每类单独都能完成，方法总数就把各类相加；如果要分几步、每一步都做完才算完成，方法总数就把各步相乘。例如 3 件上衣、2 条裤子，搭配一套要“先选上衣、再选裤子”两步，共 3×2=6 种。","next":"排列与组合（5.1）就是反复使用“分步相乘”；有了计数，才能算古典概型（5.4）的概率。","use":"密码有多少种可能（4 位数字密码有 10×10×10×10=10000 种）；车牌、电话号码够不够用；菜单能搭配出多少种套餐。","eg":"3 件上衣、2 条裤子，搭配有 3×2=6 种。","from":"这是数数时人人都会用的道理，简单到没法再用别的知识去证明，所以直接承认，作为“随机”这一部分的地基。","points":["分类加法原理（分几类，方法数相加）、分步乘法原理（分几步，方法数相乘）。"],"_pyN":"jsyl","_pyX":"$\\text{fl} n = m _{ 1 } + m _{ 2 } \\text{，fb} n = m _{ 1 } \\cdot m _{ 2 }$"},{"id":"0.6","name":"几何基本事实","full":"几何基本事实（公理）","stage":"初中→高中","one":"两点确定一条直线等公理","what":"几何里不用证明、大家直接承认的几条事实。例如“两点确定一条直线”“过直线外一点有且只有一条直线和已知直线平行”“不在一条直线上的三点确定一个平面”。","next":"平面几何的全部定理（4.9）、立体几何（4.10）；向量（3.3）的“有向线段”也来自这里。","use":"建筑放线、木工划线都默认“两点确定一条直线”；数学以外，法律、物理理论也学习这种“从少数公理出发推出一切”的方法。","eg":"由平行公理推出“三角形内角和为 180°”。","from":"这些事实太基本了，没法再用更简单的东西证明，于是直接承认。古希腊的欧几里得把全部几何建在这几条事实上，后面所有的几何定理都是从它们一步步推出来的。几何的起点不是等式，而是这些事实加上逻辑推理。","points":["几何中不证明、直接承认的事实。如“两点确定一条直线”“过直线外一点有且只有一条直线与已知直线平行”“过不共线三点有且只有一个平面”。"],"_pyN":"jhjbssjhjbss（gl）","_pyX":"ldqdytzxdgl"},{"id":"1.1","name":"自然数与运算律","full":"自然数与运算律","stage":"小学","one":"$a + b = b + a \\text{，} a \\left( b + c \\right) = ab + a c$","what":"数 0、1、2、3……以及加法、乘法必须遵守的三条规矩：交换律 a+b=b+a，结合律 (a+b)+c=a+(b+c)，分配律 a(b+c)=ab+ac。","next":"后面所有公式的变形，归根到底都是反复使用这三条规矩；数会一步步扩充成负数、分数、实数、复数，但这三条规矩始终不变。","use":"一切计算。心算 99×7 = 100×7 − 7 = 693，用的就是分配律。","eg":"分配律 a(b+c)=ab+ac 推出 (a+b)²=a²+2ab+b²。","from":"人类数东西，产生了自然数；三条运算律是从无数次计算中总结出来、大家约定必须遵守的规则，不需要证明。","points":["0,1,2,3,…；加法和乘法满足交换律、结合律，乘法对加法满足分配律。"],"_pyN":"zrsyysl","_pyX":"$a + b = b + a \\text{，} a \\left( b + c \\right) = ab + a c$"},{"id":"1.2","name":"整数与有理数","full":"整数与有理数","stage":"初中","one":"引入负数和分数：减法、除法总能做","what":"在自然数之外加进负数和分数。","next":"有理数还是不够：正方形的对角线长度就不是分数，于是继续扩充到实数。","use":"零下温度、欠款、海拔高低；按比例分配、打折。有了负数和分数，一次方程总有解。","eg":"3−5=−2；2÷3=2/3。","from":"自然数里 3−5 算不出来，于是发明了负数；2÷3 除不尽，于是发明了分数。每次扩充都是因为某种运算“做不下去了”。","points":["引入负数，减法总能做；引入分数，除法（除数不为 0）总能做。"],"_pyN":"zsyyls","_pyX":"yrfshfs：jf、cfznz"},{"id":"1.3","name":"实数与大小顺序","full":"实数、数轴与大小顺序","stage":"初中→高中","one":"$\\text{数轴上的点；} a > b \\iff a - b > 0$","what":"有理数加上无理数（如 √2、π）合起来叫实数，正好铺满整条数轴，没有空隙。比大小的规定：a>b 就是 a−b>0。","next":"“a>b 就是 a−b>0”这一条，是后面所有不等式的起点；两条数轴垂直放就成了坐标系；数轴“没有空隙”这一点，是极限、导数的基础。","use":"一切测量都要用实数；比较两个方案谁更划算，就是算一算差是正还是负。","eg":"√2≈1.414 是正方形对角线与边长之比；比较 a、b 只需看 a−b 的符号。","from":"边长为 1 的正方形，对角线长 √2，古希腊人发现它不是任何分数，有理数“不够用”，于是把无理数补进来。","points":["引入无理数（如 √2、π），实数与数轴上的点一一对应。大小顺序规定为：a>b ⇔ a−b>0。"],"_pyN":"ssydxsxss、szydxsx","_pyX":"$\\text{szsdd；} a > b \\iff a - b > 0$"},{"id":"1.5","name":"复数","full":"复数","stage":"高中","one":"$i ^{ 2 } = - 1 \\text{，} z = a + b i$","what":"引入一个新数 i，规定 i²=−1；形如 a+bi 的数叫复数。","next":"复数可以看成平面上的点和向量（见 4.15）；大学里用它描述旋转、振动和交流电。","use":"电路分析、信号处理、量子力学都离不开复数。","eg":"x²+1=0 的解是 ±i。","from":"实数范围内 x²=−1 没有解。为了让每个二次方程都有解，再扩充一次数系。代价是：复数没法比大小。扩充后运算律照样保留。","points":["引入 i（i²=−1），形如 a+bi 的数；可以和平面上的点、向量一一对应。"],"_pyN":"fs","_pyX":"$i ^{ 2 } = - 1 \\text{，} z = a + b i$"},{"id":"1.6","name":"度量","full":"度量：长度、面积、体积","stage":"小学→初中","one":"$S_{\\text{矩形}}=ab，S_{\\text{圆}}=\\pi r^2，V_{\\text{柱}}=Sh$","what":"用数来量图形有多大。从长方形面积=长×宽出发，把三角形、梯形割补成长方形求面积；把圆切成很多小扇形，拼成近似长方形，得到圆面积 πr²；再到长方体、圆柱、圆锥的体积。","next":"勾股定理可以用面积来证（4.9）；向量的长度（3.3）；立体几何的表面积和体积（4.10）；把圆“切成小块再拼起来”的想法，后来发展成定积分（6.5）——求曲线围成的面积。","use":"算房子面积、刷墙用多少漆、水箱装多少水、修路要多少土方。","eg":"圆面积 πr² 是把圆切成很多小扇形、拼成近似长方形得到的——这已经是积分的思想。","from":"有了实数（1.3），量出来的长度、面积才都有数可写；“割补以后面积不变”靠的是全等的图形面积相等，来自几何基本事实（0.6）。","points":["用数来量图形的大小。从长方形面积=长×宽出发，割补得到三角形、梯形的面积；用无限分割的办法得到圆的面积 πr²；再到长方体、圆柱、圆锥的体积。"],"_pyN":"dldl：zd、mj、tj","_pyX":"$s_{\\text{jx}}=ab，s_{\\text{y}}=\\pi r^2，v_{\\text{z}}=sh$"},{"id":"1.7","name":"绝对值与距离","full":"绝对值与距离","stage":"初中","one":"$|a-b|$ 是两点间的距离","what":"|a| 是数轴上点 a 到原点的距离，|a−b| 是两点 a、b 之间的距离。","next":"含绝对值的方程和不等式；向量的长度、复数的模都是它的推广；大学里用 |x−a|\u003cδ 把“无限接近”说严格（ε-δ 极限）。","use":"表示误差和偏差：“误差不超过 0.1”就是 |x−a|≤0.1；导航中两地距离的计算。","eg":"|x−3|\u003c2 表示到 3 的距离小于 2，即 1\u003cx\u003c5。","from":"有了数轴（1.3），就可以用“距离”来看数：距离不分方向，所以总是非负的。","points":["|a| 是数轴上点 a 到原点的距离，|a−b| 是两点 a、b 之间的距离。"],"_pyN":"jdzyjl","_pyX":"$|a-b|$ sldjdjl"},{"id":"1.8","name":"图形的变换","full":"图形的变换：平移、旋转、轴对称","stage":"初中","one":"平移、旋转、轴对称：形状大小不变","what":"把图形整体挪动（平移）、绕一个点转动（旋转）、沿一条直线翻折（轴对称）。变换前后形状和大小都不变。","next":"全等、对称的证明（4.9）；函数图像的平移和伸缩（3.7）；复数乘以 i 就是旋转 90°（4.15）；大学里用矩阵表示旋转、伸缩、投影（7.8）。","use":"地板砖、窗花的对称图案；电脑上拖动、旋转图片；动画里角色的移动。","eg":"把抛物线 y=x² 向右平移 2 个单位，得到 y=(x−2)²。","from":"变换前后的两个图形能完全重合，也就是全等，这是从几何基本事实（0.6）出发得到的。用“动起来”的眼光看图形，很多性质一下子就看出来了。","points":["把图形整体移动、绕一点转动、沿一条直线翻折，形状和大小都不变。"],"_pyN":"txdbhtxdbh：py、xz、zdc","_pyX":"py、xz、zdc：xzdxbb"},{"id":"2.1","name":"恒等变形·配方","full":"式与恒等变形","stage":"初中","one":"$\\left( a + b \\right) ^{ 2 } = a ^{ 2 } + 2 ab + b ^{ 2 } \\text{；配方}$","what":"把一个式子变成“更好用”的形状而不改变它的值。例如 (a+b)²=a²+2ab+b²；x²+2x+3=(x+1)²+2（配方）。","next":"配方 → 推出一元二次方程的求根公式，也得到二次函数的顶点；因式分解 → 用来解不等式。","use":"化简计算、巧算：102² = 10000+400+4 = 10404。把式子变成好判断符号、好求解的形式。","eg":"配方 x²+2x+3 = (x+1)²+2。","from":"反复使用分配律展开括号，就得到乘法公式；把乘法公式倒过来用就是因式分解。","points":["乘法公式、因式分解、配方、分式与根式的变形。"],"_pyN":"hdbx·pfsyhdbx","_pyX":"$\\left( a + b \\right) ^{ 2 } = a ^{ 2 } + 2 ab + b ^{ 2 } \\text{；pf}$"},{"id":"2.2","name":"等式与方程","full":"等式性质与方程","stage":"初中","one":"等式两边同加、同乘仍相等","what":"方程是含有未知数的等式。解方程就是一步步做“不改变答案”的变形，最后把 x 单独留在一边。","next":"一元二次方程；多个方程组成方程组，到大学发展成线性代数，可以一次解成百上千个方程。","use":"由已知求未知：鸡兔同笼、行程问题、配制溶液的浓度。","eg":"2x+3=7 ⇒ x=2。","from":"等式的基本性质：两边同时加（减）同一个数、同时乘（除以）同一个不为 0 的数，仍然相等。有了负数、分数（1.2），一次方程总能解。","points":["等式两边同加、同乘（同除以非零数）仍相等；方程是含未知数的等式，解方程就是同解变形。"],"_pyN":"dsyfcdsxzyfc","_pyX":"dslbtj、tcrxd"},{"id":"2.3","name":"不等式的性质","full":"不等式的性质","stage":"高中","one":"$a > b \\text{，} c \u003c 0 \\implies a c \u003c b c$","what":"比大小的规则：两边同加一个数，不等号方向不变；同乘正数，方向不变；同乘负数，方向要反过来……","next":"平方非负 → 均值不等式；判断函数是增还是减（函数柱 3.2）也是用“作差看正负”。","use":"比较两种收费方案哪个便宜；估计测量误差的范围。比较大小、解不等式、证明不等式，都以它为依据。","eg":"a>b 且 c\u003c0 ⇒ ac\u003cbc。","from":"全部由“a>b 就是 a−b>0”推出来。例如为什么乘负数要变号：ac−bc=(a−b)c，a−b 是正的，c 是负的，乘出来是负的，所以 ac\u003cbc。","points":["传递性、同加不变号、乘正数不变号、乘负数要变号、同向正数可相乘等。"],"_pyN":"bdsdxz","_pyX":"$a > b \\text{，} c \u003c 0 \\implies a c \u003c b c$"},{"id":"2.5","name":"一元二次方程","full":"一元二次方程：求根公式、判别式、韦达定理","stage":"初中→高中","one":"$x = \\frac{ - b \\pm \\sqrt{ \\Delta } }{ 2 a } \\text{，} x _{ 1 } + x _{ 2 } = - \\frac{ b }{ a }$","what":"ax²+bx+c=0（a≠0）的解法。判别式 Δ=b²−4ac 决定有几个实数根；韦达定理：两根之和为 −b/a，两根之积为 c/a。","next":"一元二次不等式；二次函数图像和 x 轴有几个交点（函数柱 4.2）；直线和椭圆、抛物线有几个交点（几何柱 4.14）；Δ\u003c0 时引出复数。","use":"抛出去的球什么时候落地；围成一定面积需要多长的边。","eg":"x²−5x+6=0，Δ=1>0，两根为 2 和 3。","from":"把方程配方，得到 (x+b/2a)² = Δ/(4a²)。左边是平方，不能是负数，所以 Δ\u003c0 时就没有实数根；Δ≥0 时两边开平方，就得到求根公式。","points":["ax²+bx+c=0（a≠0）的解法；Δ=b²−4ac 决定有几个实根；两根之和为 −b/a，两根之积为 c/a。"],"_pyN":"yyecfcyyecfc：qggs、pbs、wddl","_pyX":"$x = \\frac{ - b \\pm \\sqrt{ \\delta } }{ 2 a } \\text{，} x _{ 1 } + x _{ 2 } = - \\frac{ b }{ a }$"},{"id":"2.6","name":"均值不等式与最值","full":"均值不等式与最值","stage":"高中","one":"$a , b > 0 \\text{：} \\frac{ a + b }{ 2 } \\geqslant \\sqrt{ ab } \\text{，积定和最小}$","what":"两个正数的平均数，不小于它们乘积的平方根：(a+b)/2 ≥ √(ab)，两数相等时取等号。由此得到：积一定时和最小，和一定时积最大。","next":"大学里更多的不等式（柯西不等式等）；和导数一样，是求最大值、最小值的工具（函数柱 6.4）。","use":"篱笆总长一定，围成正方形面积最大；包装盒怎样设计最省材料。也常用来证明不等式。","eg":"周长为 20 的矩形，长宽都是 5 时面积最大，为 25。","from":"从 (a−b)²≥0 出发，展开得 a²+b² ≥ 2ab；再把 a、b 换成 √a、√b，就得到均值不等式。","points":["a,b>0 时 (a+b)/2 ≥ √(ab)，当且仅当 a=b 取等；由此得“积一定和最小、和一定积最大”。"],"_pyN":"jzbdsyzz","_pyX":"$a , b > 0 \\text{：} \\frac{ a + b }{ 2 } \\geqslant \\sqrt{ ab } \\text{，jdhzx}$"},{"id":"2.8","name":"指数与对数运算","full":"指数与对数运算","stage":"初中→高中","one":"$a ^{ x } = N \\iff x = \\log _{ a } N \\text{（} a > 0 \\text{，} a \\ne 1 \\text{，} N > 0 \\text{）}$","what":"把 2³ 这样的乘方推广到 $2^{1/2}=\\sqrt{2}$、$2^{-1}=1/2$，甚至 $2^\\pi$；对数是“倒过来问”：2 的几次方等于 8？答案是 3，记作 $\\log_2 8=3$。","next":"指数函数、对数函数（函数柱 4.3），再到导数里最重要的 eˣ 和 ln x。","use":"复利和人口增长、放射性衰变；声音的分贝、溶液的 pH 值、地震的震级都是对数。计算尺就是用对数把乘法变成加法。","eg":"2¹⁰=1024 ⇔ log₂1024=10。","from":"为了让 aᵐ·aⁿ=aᵐ⁺ⁿ 这条规律一直成立，指数只能这样推广；对数作为指数的逆运算出现，历史上用来把乘法变成加法，简化天文计算。整数指数的运算律来自乘方就是连乘，由结合律（1.1）得到。","points":["把指数从正整数推广到整数、分数、实数（aᵐ·aⁿ=aᵐ⁺ⁿ 保持成立）；对数是指数的逆运算：aˣ=N ⇔ x=logₐN（a>0，a≠1，N>0）。"],"_pyN":"zsydsys","_pyX":"$a ^{ x } = n \\iff x = \\log _{ a } n \\text{（} a > 0 \\text{，} a \\ne 1 \\text{，} n > 0 \\text{）}$"},{"id":"3.1","name":"函数","full":"函数","stage":"初中→高中","one":"$y = f \\left( x \\right) \\text{：每个} x \\text{对应唯一的} y$","what":"一种对应关系：给定一个 x，就有唯一确定的一个 y 和它对应。它描述“一个量怎样随另一个量变化”。例如出租车费 y 由路程 x 决定，每个路程只对应一个价钱。","next":"函数的性质（3.2）、图像变换（3.7）、复合函数（3.8）；数列（3.5）是特殊的函数；一次、二次、指数、对数、三角函数都是具体的函数；导数（6.2）研究函数变化的快慢。方程、不等式都可以看成函数的一个“截面”：f(x)=0 的根就是函数的零点（4.17）。","use":"路程与时间、成本与产量、气温与时刻……凡是“一个量决定另一个量”的地方都用函数描述。","eg":"路程 s=60t，路程是时间的函数。","from":"初中把函数看成“两个变量的关系”，高中用集合（0.2）把它说得更准确：x 的取值范围叫定义域，y 的取值范围叫值域，都是集合。这样分段函数、只在整数上取值的函数也都能统一叫函数。","points":["一种对应关系——每个 x 对应唯一的 y；用来描述“一个量怎样随另一个量变化”。"],"_pyN":"hs","_pyX":"$y = f \\left( x \\right) \\text{：mg} x \\text{dywyd} y$"},{"id":"3.2","name":"函数的性质","full":"函数的性质：单调性、奇偶性、周期性、最值","stage":"高中","one":"单调、奇偶、周期、最值","what":"从几个角度看函数图像“长什么样”：往右是上升还是下降（单调性），左右是否对称（奇偶性），是否一段一段重复（周期性），最高点、最低点在哪（最值）。例如 y=x² 在 x≥0 时上升，图像关于 y 轴对称，最小值是 0。","next":"幂、指数、对数函数（4.3）都按这几条性质来研究；函数模型的增长快慢（4.18）比的是单调性；导数（6.4）给出判断单调性、求最值更强的工具。","use":"找最省钱、最省料的方案（最值）；判断销量是在增长还是下降（单调）；钟表、潮汐的重复规律（周期）。数学里用来比较函数值大小、解不等式、求最值、画图像。","eg":"f(x)=x² 在 [0,+∞) 上递增，是偶函数，最小值为 0。","from":"有了函数（3.1），自然要问它怎么变化。判断“上升还是下降”要比较两个函数值谁大，用的正是不等式的“作差看正负”（2.3）。","points":["描述函数图像“怎么变”的几个角度：增还是减、是否对称、是否重复、最高最低点。"],"_pyN":"hsdxzhsdxz：ddx、qox、zqx、zz","_pyX":"dd、qo、zq、zz"},{"id":"3.3","name":"向量","full":"向量","stage":"高中","one":"$a + b \\text{、} \\lambda a \\text{；} a = x e _{ 1 } + y e _{ 2 }$","what":"既有大小又有方向的量，例如力、速度、位移。用带箭头的线段表示：长度表示大小，箭头表示方向。两个向量可以相加（首尾相接，或平行四边形法则），也可以乘一个数（拉长、缩短或反向）。","next":"数量积（4.5）、空间向量法（4.11）；复数可以看成向量（4.15）；大学里推广到 n 维向量，就是线性代数（7.7）。","use":"两个人一起拉车，合力怎么算；飞机在有风时的实际航向；游戏和动画里物体的运动方向。把几何图形的位置关系变成可以计算的量。","eg":"两个力的合力用平行四边形法则求。","from":"物理里的力和速度光有大小不够，还必须说清方向；于是把几何里的有向线段（0.6）和实数（1.3）结合起来，“长度”来自度量（1.6）。平面里任何一个向量都能用两个不共线的向量表示，这样向量就有了坐标，可以直接计算。","points":["既有大小又有方向的量（力、速度、位移）；可以相加、数乘；平面内任一向量都能由两个不共线向量表示（基底与坐标）。"],"_pyN":"xl","_pyX":"$a + b \\text{、} \\lambda a \\text{；} a = x e _{ 1 } + y e _{ 2 }$"},{"id":"3.5","name":"数列","full":"数列","stage":"高中","one":"$a _{ n } = f \\left( n \\right) \\text{，} n \\text{取正整数}$","what":"按顺序排成的一列数 a₁, a₂, a₃, ……。它其实是一个特殊的函数：自变量只取 1, 2, 3, … 这些正整数，第 n 项 aₙ 就是 n 对应的函数值。例如 1, 3, 5, 7, … 的第 n 项是 2n−1。","next":"等差数列、等比数列与求和（4.16）；大学里研究无穷多项相加的级数（7.4）。","use":"分期付款、银行利息、人口逐年统计、细胞分裂的次数。","eg":"1,3,5,7,… 的第 n 项是 aₙ=2n−1。","from":"很多量不是连续变化的，而是一次一次、一年一年地变：每月存款、每年人口、每次弹跳的高度。把函数（3.1）的定义域限制在正整数上，就得到数列。","points":["按顺序排列的一列数 a₁,a₂,…；本质是定义域为正整数集的函数。"],"_pyN":"sl","_pyX":"$a _{ n } = f \\left( n \\right) \\text{，} n \\text{qzzs}$"},{"id":"3.6","name":"随机事件","full":"随机事件与样本空间","stage":"高中","one":"事件是样本空间的子集","what":"做一次试验，所有可能结果放在一起叫样本空间；我们关心的某种情况，就是样本空间的一部分，叫随机事件。例如掷一枚骰子，样本空间是 {1,2,3,4,5,6}，“点数为偶数”这个事件是 {2,4,6}。","next":"有了事件，才能给事件规定概率（5.3）；大学里的概率论也一直用这套集合语言。","use":"天气预报中的“明天下雨”、体检中的“检测结果为阳性”、保险中的“一年内出险”，都是随机事件。","eg":"掷一枚骰子，“点数为偶数”这一事件是 {2,4,6}。","from":"要准确说清“可能发生什么”，就要用集合（0.2）的语言：事件就是集合，“A 或 B 发生”是并集，“A 且 B 都发生”是交集，“A 不发生”是补集。","points":["试验的所有可能结果组成样本空间，事件是它的子集；事件的“和、积、对立”就是集合的并、交、补。"],"_pyN":"sjsjsjsjyybkj","_pyX":"sjsybkjdzj"},{"id":"3.7","name":"函数的图像变换","full":"函数的图像变换：平移、伸缩、对称","stage":"高中","one":"$y = f \\left( x - h \\right) + k \\text{，} y = A f \\left( \\omega x \\right)$","what":"已知一个函数的图像，不用重新描点，就能画出相关函数的图像：y=f(x−2) 是把图像向右平移 2；y=f(x)+1 是向上平移 1；y=2f(x) 是上下拉伸到 2 倍；y=f(−x) 是关于 y 轴翻折。","next":"二次函数的顶点式（4.2）就是 y=ax² 平移得到的；正弦型函数 y=Asin(ωx+φ)（4.7）由 y=sinx 平移、伸缩得到。","use":"由一个熟悉的函数图像快速画出复杂函数的图像；看懂式子里每个参数的作用，比如声音的音量和音调分别对应正弦曲线的哪种伸缩。","eg":"y=(x−2)²+1 由 y=x² 向右平移 2、向上平移 1 得到。","from":"初中学过把图形平移、旋转、翻折（1.8）。把这种“整体移动图形”的办法用到函数（3.1）的图像上，就得到图像变换——平移图像，相当于在式子里把 x 换成 x−2 这样的简单改动。","points":["由 y=f(x) 的图像得到 y=f(x−h)+k（平移）、y=Af(ωx)（伸缩）、y=f(−x)（对称）的图像。"],"_pyN":"hsdtxbhhsdtxbh：py、ss、dc","_pyX":"$y = f \\left( x - h \\right) + k \\text{，} y = a f \\left( \\omega x \\right)$"},{"id":"4.2","name":"二次函数","full":"二次函数","stage":"初中→高中","one":"$y = a \\left( x - h \\right) ^{ 2 } + k \\text{，顶点} \\left( h , k \\right)$","what":"y=ax²+bx+c（a≠0），图像是抛物线。把它配方成 y=a(x−h)²+k，就能直接读出顶点 (h,k)、对称轴 x=h 和最大（小）值 k；a>0 开口向上，a\u003c0 开口向下。例如 y=x²−4x+3=(x−2)²−1，最小值为 −1。","next":"抛物线这种曲线在圆锥曲线（4.13）中再次出现；导数研究函数（6.4）时，二次函数是最常见的例子。","use":"抛出去的球的轨迹、喷泉的水流形状、“围成最大面积”“利润最大”这类最值问题。它是最常见的非线性模型。","eg":"y=x²−4x+3=(x−2)²−1，顶点 (2,−1)，最小值 −1。","from":"它是函数（3.1）的一个特例。配方（2.1）把式子变成顶点式；顶点式正好说明它的图像是由 y=ax² 平移（3.7）得到的；图像与 x 轴有几个交点，由一元二次方程的判别式（2.5）决定；它和一元二次不等式（2.7）、一元二次方程是同一个式子的三种问法。","points":["y=ax²+bx+c（a≠0），图像是抛物线；配方后得到顶点、对称轴、最值。"],"_pyN":"echs","_pyX":"$y = a \\left( x - h \\right) ^{ 2 } + k \\text{，dd} \\left( h , k \\right)$"},{"id":"4.3","name":"幂·指数·对数函数","full":"幂函数、指数函数、对数函数","stage":"高中","one":"$y = x ^{ \\alpha } \\text{，} y = a ^{ x } \\text{，} y = \\log _{ a } x$","what":"幂函数 y=x^α（底数变、指数固定，如 y=x³）；指数函数 y=aˣ（底数固定、指数变，如 y=2ˣ，每次乘 2，“翻倍增长”）；对数函数 y=logₐx 是指数函数“反过来问”，两者的图像关于直线 y=x 对称。","next":"比较增长快慢的函数模型（4.18）：时间足够长时，指数 > 幂 > 对数；公比 q>0 且 q≠1 时，等比数列（4.16）就是指数型函数只取正整数的情形；求导公式（6.3）里最重要的 eˣ 和 ln x。","use":"细菌繁殖、复利（指数增长）；放射性衰变、药物在体内的代谢（指数衰减）；声音分贝、地震震级、pH 值（对数）。","eg":"细菌每小时翻倍，t 小时后数量为 2ᵗ 倍。","from":"有了实数指数和对数运算（2.8），就可以把它们写成函数；再用函数的性质（3.2）去研究它们：a>1 时指数函数递增，0\u003ca\u003c1 时递减，等等。","points":["y=x^α、y=aˣ、y=logₐx；指数函数与对数函数互为反函数，图像关于 y=x 对称。"],"_pyN":"m·zs·dshsmhs、zshs、dshs","_pyX":"$y = x ^{ \\alpha } \\text{，} y = a ^{ x } \\text{，} y = \\log _{ a } x$"},{"id":"4.4","name":"三角函数","full":"任意角与三角函数","stage":"初中锐角→高中任意角","one":"$\\sin ^{ 2 } \\alpha + \\cos ^{ 2 } \\alpha = 1 \\text{；诱导公式}$","what":"在单位圆（半径为 1 的圆）上，从 x 轴正方向转过角 α，终点的坐标就是 (cosα, sinα)。角可以转过 360° 以上、也可以反着转，所以 sinα、cosα 对任何角都有定义，而且每转一圈就重复一次。例如 sin²α+cos²α=1，就是单位圆方程 x²+y²=1；单位圆上点的对称，还给出了诱导公式。","next":"三角恒等变换（4.6）、三角函数的图像与性质（4.7）；解三角形（4.8）；数量积（4.5）用到夹角的余弦；求导公式（6.3）中的 (sinx)′=cosx。","use":"描述一切周期现象：钟摆、潮汐、四季气温、交流电、声波；测量中计算角度和距离。","eg":"sin²α+cos²α=1，来自单位圆方程 x²+y²=1。","from":"初中的 sin、cos 是直角三角形里的边长比，只能用于锐角。为了描述转动、周期往复的现象，把它推广到任意角：借助坐标（3.4）里的单位圆来定义，并把角看成自变量，于是成了函数（3.1）。","points":["用弧度把角变成实数；在单位圆上，角 α 终边上的点为 (cosα, sinα)；弧度制直接给出弧长与扇形面积。"],"_pyN":"sjhsryjysjhs","_pyX":"$\\sin ^{ 2 } \\alpha + \\cos ^{ 2 } \\alpha = 1 \\text{；ydgs}$"},{"id":"4.5","name":"数量积","full":"数量积","stage":"高中","one":"$\\mathbf a\\cdot\\mathbf b=|\\mathbf a|\\,|\\mathbf b|\\cos\\theta=x_1x_2+y_1y_2$","what":"两个向量的一种乘法：a·b=|a||b|cosθ，即两个长度相乘，再乘上夹角的余弦。用坐标算更简单：(x₁,y₁)·(x₂,y₂)=x₁x₂+y₁y₂。结果是一个数。例如 (1,2)·(2,−1)=2−2=0，说明这两个向量互相垂直。","next":"余弦定理（4.8）由它推出；三角恒等变换中的差角余弦公式也能用它推出（4.6）；空间向量法（4.11）用它判断线面垂直、求角。","use":"物理里求一个力做了多少功（力和位移的数量积）；计算机图形里判断光线照在表面上的明暗。","eg":"(1,2)·(2,−1)=0，两向量垂直。","from":"向量（3.3）能加减、能数乘，但还不能直接算长度和角度。于是定义了一种新的乘法，夹角的余弦来自三角函数（4.4）。这一个运算就能同时求长度、求角度、判断垂直。","points":["a·b=|a||b|cosθ，坐标形式为 x₁x₂+y₁y₂。"],"_pyN":"slj","_pyX":"$\\mathbf a\\cdot\\mathbf b=|\\mathbf a|\\,|\\mathbf b|\\cos\\theta=x_1x_2+y_1y_2$"},{"id":"4.6","name":"三角恒等变换","full":"三角恒等变换","stage":"高中","one":"$\\sin \\left( \\alpha + \\beta \\right) = \\sin \\alpha \\cos \\beta + \\cos \\alpha \\sin \\beta$","what":"一组把不同角的三角函数互相转化的公式：两角差、和的公式，二倍角公式，辅助角公式等。例如 sinx+cosx=√2·sin(x+45°)，所以它的最大值是 √2。","next":"化简正弦型函数（4.7），求周期和最值；大学里的傅里叶分析把复杂信号拆成很多正弦波的叠加。","use":"化简三角式；把 a·sinx+b·cosx 化成一个正弦函数来求最大值；信号处理中合成与分解波形。","eg":"sinx+cosx = √2·sin(x+π/4)，最大值 √2。","from":"关键的第一步是推出 cos(α−β)=cosαcosβ+sinαsinβ：把两个角放在单位圆上，取两个单位向量，用它们的数量积（4.5）来计算夹角的余弦，就得到这个公式。其余公式都由它一步步推出来。这是人教 B 版的推法。","points":["和角、差角、倍角、半角公式，辅助角公式。"],"_pyN":"sjhdbh","_pyX":"$\\sin \\left( \\alpha + \\beta \\right) = \\sin \\alpha \\cos \\beta + \\cos \\alpha \\sin \\beta$"},{"id":"4.7","name":"三角函数图像","full":"三角函数的图像与性质；正弦型函数 y=Asin(ωx+φ)","stage":"高中","one":"$y=A\\sin(\\omega x+\\varphi)\\ (A,\\omega>0)，T=\\frac{2\\pi}{\\omega}$","what":"把 sinx、cosx、tanx 画成图像，就能看出它们的周期、值域、单调区间和对称性：正弦、余弦是周期 2π 的波，正切是周期 π、被竖直渐近线隔开的一支支曲线。在 y=sinx 的基础上改三个数：A 决定波有多高（振幅），ω 决定波有多密（周期 T=2π/ω），φ 是初相，图像左右平移的距离是 |φ/ω|（例如 y=sin(2x+π/3) 是由 y=sin2x 向左平移 π/6）。例如交流电电压 u=220√2·sin(100πt)，每秒完成 50 个周期。","next":"三角恒等变换（4.6）常用来把式子化成这种形式；大学里用它描述振动、波动方程，用很多正弦波叠加表示任意周期信号。","use":"弹簧振子、单摆、交流电、声音、潮汐和昼长的变化规律。","eg":"交流电电压 u=220√2·sin(100πt)。","from":"三角函数（4.4）给出了最基本的波 y=sinx；用函数的性质（3.2）去研究它的周期、单调和对称；用函数图像的平移和伸缩（3.7），就能得到各种振幅、快慢、起点不同的波。","points":["正弦、余弦、正切函数的图像与性质（定义域、值域、周期、单调区间、对称性）；y=Asin(ωx+φ) 的振幅 A、周期 2π/ω、初相 φ，由 y=sinx 经平移和伸缩得到。"],"_pyN":"sjhstxsjhsdtxyxz；zxxhs y=asin(ωx+φ)","_pyX":"$y=a\\sin(\\omega x+\\varphi)\\ (a,\\omega>0)，t=\\frac{2\\pi}{\\omega}$"},{"id":"4.8","name":"解三角形","full":"解三角形：正弦定理、余弦定理","stage":"高中","one":"$\\frac a{\\sin A}=2R；a^2=b^2+c^2-2bc\\cos A$","what":"正弦定理：每条边与它对角的正弦之比都相等。余弦定理：a²=b²+c²−2bc·cosA。已知三角形的部分边和角，就能求出其余的边和角。例如两边为 3、4，夹角 60°，第三边=√(9+16−12)=√13。","next":"测量中的各种计算；与向量、三角函数一起用于物理中的力的分解。","use":"测量河对岸两点的距离、山的高度；航海和航空中确定位置和航向。已知三角形的部分边、角，求其余的边、角。","eg":"已知两边 3、4，夹角 60°，第三边 = √(9+16−12) = √13。","from":"把三角形的一条边写成另两条边对应向量的差，两边做数量积（4.5）、平方展开，就得到余弦定理；角的正弦、余弦来自三角函数（4.4）。勾股定理（4.9）就是夹角为 90° 时的余弦定理。","points":["a/sinA = b/sinB = c/sinC；a² = b²+c²−2bc·cosA。"],"_pyN":"jsjxjsjx：zxdl、yxdl","_pyX":"$\\frac a{\\sin a}=2r；a^2=b^2+c^2-2bc\\cos a$"},{"id":"4.9","name":"平面几何","full":"平面几何：全等、相似、勾股定理、圆","stage":"初中","one":"$a ^{ 2 } + b ^{ 2 } = c ^{ 2 } \\text{；全等、相似、圆}$","what":"三角形全等和相似的判定、勾股定理（直角三角形两直角边的平方和等于斜边的平方）、圆的性质（同一段弧所对的圆周角相等、切线垂直于半径）。例如两直角边为 3、4 的直角三角形，斜边为 5。","next":"立体几何的计算最后都要化到平面上（4.10）；勾股定理给出坐标里两点间的距离公式，于是有了圆的方程（4.12）；余弦定理是勾股定理的推广（4.8）。","use":"建筑、测绘中检查墙角是不是直角（3、4、5 的绳子）；按比例画地图、模型的放大缩小。","eg":"直角三角形两直角边 3、4，斜边为 5。","from":"从几何基本事实（0.6）出发，靠逻辑推理一条条证明出来；勾股定理可以用面积的割补来证明（1.6）；全等和对称（轴对称、旋转与中心对称）用图形的变换来理解（1.8）。","points":["三角形全等与相似的判定，勾股定理，圆的性质（圆周角、切线）。"],"_pyN":"pmjhpmjh：qd、xs、ggdl、y","_pyX":"$a ^{ 2 } + b ^{ 2 } = c ^{ 2 } \\text{；qd、xs、y}$"},{"id":"4.10","name":"立体几何","full":"立体几何：空间几何体、平行与垂直","stage":"高中","one":"$V \\text{锥} = \\frac{ 1 }{ 3 } S h \\text{；线面垂直的判定}$","what":"先认识柱、锥、台、球这些空间几何体，学会画直观图、算表面积和体积；再研究空间里点、直线、平面的位置关系：直线和平面平行、垂直的判定与性质。例如一条直线垂直于平面里两条相交直线，它就垂直于这个平面。","next":"空间向量法（4.11）用计算代替推理，解决同样的问题；大学里推广到多元微积分中的空间图形。","use":"建筑和机械设计中判断墙面、零件是否垂直；计算水池、粮仓、零件的容积和用料。判断空间的位置关系，计算体积、角度、距离。","eg":"一条直线垂直于平面内两条相交直线，就垂直于这个平面。","from":"从空间的几何基本事实（0.6）推出；判断和计算时，总要把空间问题放到某个平面上，用平面几何（4.9）去算；表面积和体积来自度量（1.6）。","points":["柱、锥、台、球等空间几何体的结构、直观图、表面积与体积；点、线、面的位置关系；线面平行、面面垂直等的判定与性质。"],"_pyN":"ltjhltjh：kjjht、pxycz","_pyX":"$v \\text{z} = \\frac{ 1 }{ 3 } s h \\text{；xmczdpd}$"},{"id":"4.11","name":"空间向量法","full":"空间向量法","stage":"高中","one":"用法向量求角和距离","what":"在空间里建立 x、y、z 三条坐标轴，用方向向量表示直线的方向，用法向量（垂直于平面的向量）表示平面的朝向，把平行、垂直、角度、距离都变成向量的计算。例如两个平面的法向量数量积为 0，这两个平面就互相垂直。","next":"大学里的多元微积分、线性代数（7.7）都在空间向量的基础上展开。","use":"三维建模和游戏引擎计算物体的位置和朝向；机器人手臂的运动控制；飞行器姿态计算。","eg":"两平面的法向量数量积为 0 ⇔ 两平面垂直。","from":"把平面里的向量（3.3）和数量积（4.5）推广到空间；用来解决立体几何（4.10）的问题，不用添辅助线，直接算。","points":["建立空间直角坐标系，用方向向量和法向量把平行、垂直、角、距离都变成计算。"],"_pyN":"kjxlf","_pyX":"yfxlqjhjl"},{"id":"4.12","name":"直线与圆的方程","full":"直线与圆的方程","stage":"高中","one":"$\\left( x - a \\right) ^{ 2 } + \\left( y - b \\right) ^{ 2 } = r ^{ 2 } \\text{；} k = \\tan \\alpha$","what":"直线方程（如 y=kx+b，k 是斜率）、圆的方程 (x−a)²+(y−b)²=r²、点到直线的距离公式。用方程就能判断直线和圆是相交、相切还是相离。例如圆心 (0,0) 到直线 x+y−2=0 的距离是 2/√2=√2。","next":"圆锥曲线（4.13）用同样的办法按定义列式；线性规划等都用到直线方程。","use":"雷达和信号塔的覆盖范围（圆）；判断一条航线会不会穿过某个区域；工程制图。用方程判断直线、圆之间相交、相切还是相离。","eg":"圆心 (0,0) 到直线 x+y−2=0 的距离为 √2。","from":"用坐标法（3.4）和曲线与方程（3.9）的思路，把直线和圆写成方程；圆是“到圆心距离等于半径的点”，距离用两点间距离公式表示，这个公式来自勾股定理（4.9）。","points":["直线方程（斜率、点斜式、一般式）；圆的方程 (x−a)²+(y−b)²=r²；点到直线的距离。"],"_pyN":"zxyydfc","_pyX":"$\\left( x - a \\right) ^{ 2 } + \\left( y - b \\right) ^{ 2 } = r ^{ 2 } \\text{；} k = \\tan \\alpha$"},{"id":"4.13","name":"圆锥曲线","full":"圆锥曲线：椭圆、双曲线、抛物线","stage":"高中","one":"$\\frac{ x ^{ 2 } }{ a ^{ 2 } } + \\frac{ y ^{ 2 } }{ b ^{ 2 } } = 1 \\text{，} e = \\frac{ c }{ a }$","what":"到两个定点距离之和为常数（这个常数要大于两定点间的距离）的点组成椭圆，距离之差的绝对值为常数（大于 0 且小于两定点间的距离）的点组成双曲线，到一个定点和一条定直线距离相等（定点不在直线上）的点组成抛物线。例如 x²/4+y²=1 是一个长轴为 4、短轴为 2 的椭圆。","next":"直线与圆锥曲线的联立（4.14）；大学里统一成二次曲线，用矩阵（7.7）来分类。","use":"行星绕太阳的轨道是椭圆；探照灯、卫星天线做成抛物面，能把光、信号聚到焦点；利用双曲线可以由时间差来定位。","eg":"x²/4+y²=1 是长轴为 4、短轴为 2 的椭圆。","from":"按定义用两点间距离公式（4.12）列出方程再化简，这正是“曲线与方程”（3.9）的做法；抛物线和二次函数（4.2）的图像是同一种曲线。","points":["到两定点 F₁、F₂ 距离之和为常数且大于 |F₁F₂|（椭圆）、之差的绝对值为常数且大于 0、小于 |F₁F₂|（双曲线）、到定点与定直线距离相等且定点不在定直线上（抛物线）的点的轨迹及其方程。"],"_pyN":"yzqxyzqx：ty、sqx、pwx","_pyX":"$\\frac{ x ^{ 2 } }{ a ^{ 2 } } + \\frac{ y ^{ 2 } }{ b ^{ 2 } } = 1 \\text{，} e = \\frac{ c }{ a }$"},{"id":"4.15","name":"复数的几何意义","full":"复数的几何意义与运算","stage":"高中","one":"$a+bi\\leftrightarrow(a,b)$；乘 $i$ 即转 $90^\\circ$","what":"复数 a+bi 就是平面上的点 (a,b)，也是从原点出发的一个向量；复数相加就是向量相加，乘以 i 就是把它绕原点逆时针转 90°。","next":"大学里的欧拉公式 e^(iθ)=cosθ+i·sinθ，把指数、三角和复数统一起来。","use":"交流电的计算、信号处理、计算机图形的旋转。用代数运算表示平面上的旋转和伸缩。","eg":"(1+i)·i = −1+i，点 (1,1) 绕原点转了 90°。","from":"把复数（1.5）和向量（几何柱 3.3）放在一起看。","points":["复数 a+bi ↔ 点 (a,b) ↔ 向量；复数加减就是向量加减；乘以 i 相当于逆时针旋转 90°。"],"_pyN":"fsdjhyyfsdjhyyyys","_pyX":"$a+bi\\leftrightarrow(a,b)$；c $i$ jz $90^\\circ$"},{"id":"4.16","name":"等差·等比数列","full":"等差数列、等比数列与求和","stage":"高中","one":"$a _{ n } = a _{ 1 } + \\left( n - 1 \\right) d \\text{；} a _{ n } = a _{ 1 } q ^{ n - 1 }$","what":"等差数列每次加同一个数，如 2, 5, 8, 11, …；等比数列每次乘同一个数，如 3, 6, 12, 24, …。它们有通项公式和前 n 项和公式，例如 1+2+…+100=5050。","next":"等比数列求和、让项数趋于无穷，就是大学里的级数（7.4）；数列模型是数学建模（8.1）的常见工具。","use":"分期付款每月还多少钱、复利存款多少年能翻倍、逐年增长的产量计算。递推过程的计算。","eg":"1+2+…+100=5050（倒序相加）。","from":"它们是数列（3.5）中最基本的两类：公差 d≠0 时，等差数列就是一次函数（4.1）只取正整数，公比 q>0 且 q≠1 时，等比数列就是指数型函数（4.3）只取正整数。求和公式用“倒序相加”“错位相减”推出来，通项公式可以用数学归纳法（0.4）证明。","points":["每项加同一个数（等差）或乘同一个数（等比）；通项公式与前 n 项和公式。"],"_pyN":"dc·dbsldcsl、dbslyqh","_pyX":"$a _{ n } = a _{ 1 } + \\left( n - 1 \\right) d \\text{；} a _{ n } = a _{ 1 } q ^{ n - 1 }$"},{"id":"4.17","name":"函数的零点","full":"函数的零点与方程的近似解","stage":"高中","one":"$f \\text{在} \\left[ a , b \\right] \\text{连续且} f \\left( a \\right) f \\left( b \\right) \u003c 0 \\implies \\text{有零点}$","what":"使 f(x)=0 的 x 叫零点，它就是方程 f(x)=0 的根，也是函数图像与 x 轴交点的横坐标。如果函数连续，并且在区间两端一正一负，那么中间一定有零点；不断把区间对半分，就能把零点找得越来越精确（二分法）。例如 x³+x−1=0 在 0 和 1 之间有根。","next":"用导数（6.4）判断方程根的个数；大学里的数值计算方法（牛顿迭代法等）。","use":"计算器和计算机求方程的近似解；工程中求“什么时候达到某个值”。判断方程有没有根、根在哪里。","eg":"x³+x−1=0 在 (0,1) 内有根，因为 f(0)=−1\u003c0，f(1)=1>0。","from":"解方程（2.2）有时没有公式可用，比如 x³+x−1=0。换一个角度，把方程看成函数（3.1）的图像与 x 轴的交点。“两端异号，中间必有零点”这一点，靠的是实数的连续性（1.4）——数轴没有空隙，图像不会“跳过”x 轴。","points":["f(x)=0 的根就是函数图像与 x 轴交点的横坐标；函数连续且两端异号时，中间必有零点；二分法求近似解。"],"_pyN":"hsdldhsdldyfcdjsj","_pyX":"$f \\text{z} \\left[ a , b \\right] \\text{lxq} f \\left( a \\right) f \\left( b \\right) \u003c 0 \\implies \\text{yld}$"},{"id":"4.18","name":"函数模型与增长快慢","full":"函数模型与增长快慢","stage":"高中","one":"$a ^{ x } \\text{（} a > 1 \\text{）最终比} x ^{ n } \\text{、} \\log _{ a } x \\text{增长快}$","what":"用一次函数、指数函数、对数函数、幂函数描述实际问题，并比较它们增长的快慢：时间足够长时，底数大于 1 的指数增长最终会超过任何幂函数，幂函数（指数为正）又超过对数函数。例如每年加 100 元（线性）和每年涨 10%（指数），时间够长后后者远远超过前者。","next":"数学建模（8.1）：根据数据选模型、检验、修正；导数（6.2）可以精确比较“变化快慢”。","use":"人口与疫情预测、存款方案比较、判断“直线增长”和“指数爆炸”的差别。","eg":"每年增加 100 元（线性）和每年增长 10%（指数），时间足够长后后者远远超过前者。","from":"认识了一次函数（4.1）和幂、指数、对数函数（4.3）之后，实际问题就要求我们选一个合适的模型；比较增长快慢，看的是函数的单调性和变化速度（3.2）。","points":["用一次函数、指数函数、对数函数、幂函数描述实际问题；比较它们增长的快慢：时间足够长时，指数增长最终超过幂函数，幂函数超过对数函数。"],"_pyN":"hsmxyzzkm","_pyX":"$a ^{ x } \\text{（} a > 1 \\text{）zzb} x ^{ n } \\text{、} \\log _{ a } x \\text{zzk}$"},{"id":"5.1","name":"排列与组合","full":"排列与组合","stage":"高中","one":"$A _{ n } ^{ m } = \\frac{ {n !} }{ {\\left( n - m \\right) !} } \\text{，} C _{ n } ^{ m } = \\frac{ A _{ n } ^{ m } }{ {m !} }$","what":"从 n 个不同的东西里取 m 个：讲顺序叫排列，个数记作 Aₙᵐ；不讲顺序叫组合，个数记作 Cₙᵐ。例如 5 人中选正、副班长各一名（有顺序），A₅²=5×4=20 种；选 2 人当代表（无顺序），C₅²=20÷2=10 种。","next":"二项式定理（5.2）的系数就是组合数；古典概型（5.4）里的“结果数”大多靠排列组合来数。","use":"彩票中奖概率（35 个号码选 5 个，共 C₃₅⁵=324632 种）、比赛赛程安排、密码破解要试多少次。","eg":"5 人选 2 人当正副班长 A₅²=20 种；选 2 人当代表 C₅²=10 种。","from":"把“取 m 个排成一列”拆成 m 步：第一个位置有 n 种选法，第二个有 n−1 种……用计数原理（0.5）的“分步相乘”就得到排列数；组合不讲顺序，每组被重复算了 m! 次，再除掉即可。有限制条件时，还要按情况分类相加（0.5）。","points":["从 n 个不同元素中取 m 个，讲顺序的叫排列 Aₙᵐ，不讲顺序的叫组合 Cₙᵐ。"],"_pyN":"plyzh","_pyX":"$a _{ n } ^{ m } = \\frac{ {n !} }{ {\\left( n - m \\right) !} } \\text{，} c _{ n } ^{ m } = \\frac{ a _{ n } ^{ m } }{ {m !} }$"},{"id":"5.2","name":"二项式定理","full":"二项式定理","stage":"高中","one":"$\\left( a + b \\right) ^{ n } = \\sum C _{ n } ^{ k } a ^{ n - k } b ^{ k }$","what":"(a+b)ⁿ 展开后，每一项是 Cₙᵏaⁿ⁻ᵏbᵏ，k 从 0 取到 n。例如 (a+b)³=a³+3a²b+3ab²+b³，系数 1、3、3、1 正好是 C₃⁰、C₃¹、C₃²、C₃³。","next":"二项分布（5.8）的概率公式正好是它展开式中的一项；大学里推广为泰勒展开等无穷形式的展开。","use":"近似计算（1.01¹⁰≈1+10×0.01=1.1）；计算复利的增长；遗传学中计算后代各种基因型的比例。展开乘方、求展开式里的特定项。","eg":"(a+b)³ = a³+3a²b+3ab²+b³。","from":"把 (a+b)ⁿ 看成 n 个括号相乘，展开时从每个括号里各取 a 或 b 一项；要得到 aⁿ⁻ᵏbᵏ，就是在 n 个括号中选 k 个取 b，方法有 Cₙᵏ 种（5.1）。这里用到的“逐项展开”就是恒等变形（2.1）。","points":["(a+b)ⁿ = Σ Cₙᵏ aⁿ⁻ᵏ bᵏ。"],"_pyN":"exsdl","_pyX":"$\\left( a + b \\right) ^{ n } = \\sum c _{ n } ^{ k } a ^{ n - k } b ^{ k }$"},{"id":"5.3","name":"概率的基本性质","full":"概率的基本性质","stage":"高中","one":"$0 \\leqslant P \\left( A \\right) \\leqslant 1 \\text{；互斥时概率相加}$","what":"概率是一个 0 到 1 之间的数，表示事件发生的可能性大小：必然事件概率为 1，不可能事件为 0；两个事件不能同时发生（互斥）时，概率可以相加；一个事件和它的对立事件概率之和为 1。例如掷 3 枚硬币，“至少一枚正面”的概率是 1−“全是反面”的概率=1−1/8=7/8。","next":"古典概型（5.4）、条件概率（5.5）、随机变量（5.6）、抽样（5.10）都建立在这几条性质上。","use":"保险公司按事故发生的概率定保费；天气预报说“降水概率 70%”；医生告诉病人手术成功率。计算复杂事件的概率：正难则反，或拆成互斥事件。","eg":"P(至少一次正面) = 1 − P(全是反面)。","upto":"7.10.1 大数定律——严格证明“频率稳定于概率”。","from":"事件是集合（3.6），所以概率的规则和集合的运算一一对应。“概率”这个数从哪来？大量重复试验中，事件发生的频率会稳定在某个数附近——高中把它作为经验事实接受，大学用大数定律（7.10）证明。","points":["概率在 0 到 1 之间；必然事件概率为 1；互斥事件的概率可以相加；对立事件概率之和为 1。"],"_pyN":"gldjbxz","_pyX":"$0 \\leqslant p \\left( a \\right) \\leqslant 1 \\text{；hcsglxj}$"},{"id":"5.5","name":"条件概率与独立","full":"条件概率、独立性、全概率公式","stage":"高中","one":"$P \\left( B \\mid A \\right) = \\frac{ P \\left( A B \\right) }{ P \\left( A \\right) }$","what":"条件概率：已知 A 发生了，B 发生的概率，P(B|A)=P(AB)÷P(A)。独立：A 发生与否不影响 B，即 P(AB)=P(A)P(B)。全概率公式：把情况分成几类，分别算再加起来。例如某病发病率 1%，检测对病人 99% 显示阳性，对健康人有 5% 误报，那么检测阳性的人真正患病的概率只有 0.0099÷0.0594≈17%。","next":"二项分布（5.8）要求每次试验相互独立；独立性检验（5.11）判断两个因素是否独立；大学里发展为贝叶斯统计。","use":"医学检测结果怎么解读；垃圾邮件过滤（看到某些词后判断是垃圾邮件的概率）；人工智能中的推理与决策。已知部分信息后重新计算概率（医学检测、天气预报）；多步独立试验。","eg":"检测阳性后真正患病的概率，用全概率公式与条件概率计算。","from":"由概率的基本性质（5.3）推出：知道了一部分信息，等于把样本空间缩小到 A，再在里面算 B 的比例。","points":["P(B|A)=P(AB)/P(A)；A、B 独立 ⇔ P(AB)=P(A)P(B)；按情况分类求总概率。"],"_pyN":"tjglydltjgl、dlx、qglgs","_pyX":"$p \\left( b \\mid a \\right) = \\frac{ p \\left( a b \\right) }{ p \\left( a \\right) }$"},{"id":"5.7","name":"期望与方差","full":"期望与方差","stage":"高中","one":"$E \\left( X \\right) = \\sum x _{ i } p _{ i } \\text{，} D \\left( X \\right) = \\sum \\left( x _{ i } - E X \\right) ^{ 2 } p _{ i }$","what":"期望 E(X) 是按概率加权的平均值，表示“平均来看会是多少”；方差 D(X) 衡量取值离平均值有多分散。例如掷骰子点数的期望是 (1+2+…+6)÷6=3.5，方差是 35/12≈2.92。","next":"正态分布（5.9）由期望和方差两个数决定；样本平均数就是用来估计期望的（5.10）；大数定律（7.10）说明大量试验的平均值会接近期望。","use":"比较两种投资方案：期望看平均收益，方差看风险大小；工厂产品尺寸的方差越小，质量越稳定；比赛中选“平均分高、发挥稳定”的选手。","eg":"掷骰子点数的期望是 3.5。","from":"由分布列（5.6）推出：把每个取值乘上它的概率再相加就是期望；把“取值减期望”的平方按概率加权平均，就是方差。","points":["期望 E(X) 是概率意义下的平均值；方差 D(X) 衡量取值偏离平均值的程度。"],"_pyN":"qwyfc","_pyX":"$e \\left( x \\right) = \\sum x _{ i } p _{ i } \\text{，} d \\left( x \\right) = \\sum \\left( x _{ i } - e x \\right) ^{ 2 } p _{ i }$"},{"id":"5.8","name":"二项分布","full":"二项分布与超几何分布","stage":"高中","one":"$P \\left( X = k \\right) = C _{ n } ^{ k } p ^{ k } \\left( 1 - p \\right) ^{ n - k }$","what":"做 n 次独立的同样试验，每次成功的概率都是 p，恰好成功 k 次的概率是 Cₙᵏpᵏ(1−p)ⁿ⁻ᵏ，这叫二项分布，它的期望是 np。例如投篮命中率 0.6，投 3 次恰好中 2 次的概率是 3×0.6²×0.4=0.432。从一批产品中不放回地抽取时，用超几何分布。","next":"当 n 很大时，成功的频率越来越接近 p，二项分布的形状也越来越接近正态曲线；大学把这两件事推广成大数定律和中心极限定理（7.10）。","use":"产品抽检中次品的个数；投篮、射击命中的次数；药物试验中有效的人数。","eg":"投篮命中率 0.6，投 3 次恰中 2 次的概率为 3×0.6²×0.4=0.432。","upto":"7.10.2 中心极限定理——n 很大时，二项分布的形状接近正态曲线。","from":"每次试验相互独立（5.5），所以“某几次中、其余不中”的概率是各次概率相乘；“哪几次中”有 Cₙᵏ 种选法，合起来正好是二项式定理（5.2）展开式中的一项；它仍是一种分布列（5.6）。","points":["n 次独立重复试验中成功 k 次的概率 Cₙᵏpᵏ(1−p)ⁿ⁻ᵏ；不放回抽取时用超几何分布。"],"_pyN":"exfbexfbycjhfb","_pyX":"$p \\left( x = k \\right) = c _{ n } ^{ k } p ^{ k } \\left( 1 - p \\right) ^{ n - k }$"},{"id":"5.10","name":"抽样与估计","full":"统计：抽样与用样本估计总体","stage":"初中→高中","one":"用样本的平均数、方差估计总体","what":"总体太大、不可能一个个调查时，就随机抽一部分（样本），用样本的频率分布、平均数、方差去估计总体。例如抽 100 名学生量身高，估计全校学生的平均身高。","next":"研究两个变量之间的关系，就是成对数据分析（5.11）；大学里发展为数理统计（7.11），能给出“估计的误差有多大”。","use":"民意调查、电视收视率调查、产品质量抽检、人口普查之外的抽样调查。不可能全部调查时，用部分推断整体。","eg":"抽 100 名学生的身高，估计全校学生的平均身高。","from":"抽样必须随机，每个个体被抽到的机会相同，样本才有代表性——这靠概率的基本性质（5.3）来保证；样本平均数对应的正是随机变量的期望（5.7）。","points":["从总体中随机抽取样本；用样本的频率分布、平均数、方差、百分位数估计总体。"],"_pyN":"cyygjtj：cyyyybgjzt","_pyX":"yybdpjs、fcgjzt"},{"id":"5.11","name":"回归与独立性检验","full":"成对数据：回归分析与独立性检验","stage":"高中","one":"$\\hat{ y } = \\hat{ b } x + \\hat{ a } \\text{，相关系数} r \\text{，} \\chi ^{ 2 } \\text{检验}$","what":"回归分析：根据两组数据（如身高和体重）找一条最贴近数据点的直线，用来预测；独立性检验：用 χ² 判断两个分类变量（如吸烟与患肺病）是否有关。","next":"大学里发展为多元回归、假设检验（7.11），也是机器学习的基础。","use":"由广告投入预测销售额；判断某种药物是否有效；人工智能中的“线性回归”模型。判断吸烟与患病是否有关。","eg":"身高与体重的回归直线 ŷ=0.8x−60。","from":"它建立在抽样估计（5.10）之上：回归直线就是用数据拟合出来的函数（3.1），最常用的是一次函数（4.1）；独立性检验检验的正是“两个事件是否独立”（5.5）。","points":["用最小二乘法拟合一条直线（回归方程）描述两个变量的关系；用 χ² 检验判断两个分类变量是否有关。"],"_pyN":"hgydlxjycdsj：hgfxydlxjy","_pyX":"$\\hat{ y } = \\hat{ b } x + \\hat{ a } \\text{，xgxs} r \\text{，} \\chi ^{ 2 } \\text{jy}$"},{"id":"6.2","name":"导数","full":"导数","stage":"高中","one":"$f'(x_0)=\\lim_{\\Delta x\\to0}\\frac{\\Delta y}{\\Delta x}$","what":"汽车速度表上显示的是“这一刻”的速度，这就是导数。做法是：先算一小段时间里的平均速度＝路程变化÷时间变化，再让这段时间越来越短，平均速度靠向的那个数就是瞬时速度。写成式子是 f′(x₀)＝lim(Δx→0)[f(x₀+Δx)−f(x₀)]/Δx，意思就是“平均变化率在间隔趋于 0 时的极限”。在图像上，它是曲线在这一点切线的斜率。","next":"有了定义，就能推出各种函数的求导公式和法则（6.3）；求导反过来做就是积分（6.5）；大学里发展成中值定理、泰勒展开（7.2）和微分方程（7.6）。","use":"例：路程 s＝t² 米，在 t＝3 秒时瞬时速度 s′(3)＝6 米/秒。测速、加速度计算、曲线的切线、边际成本（多生产一件产品成本增加多少）都是导数。","eg":"s=t²，t=3 时瞬时速度 s′(3)=6。","from":"函数（3.1）能描述“路程随时间变化”，但只能算出一段时间的平均速度；要知道某一瞬间的速度，就得让时间间隔趋于 0，于是用到了极限思想（6.1）。","points":["f′(x₀) = lim(Δx→0) [f(x₀+Δx)−f(x₀)]/Δx，即瞬时变化率；几何意义是切线斜率。"],"_pyN":"ds","_pyX":"$f'(x_0)=\\lim_{\\delta x\\to0}\\frac{\\delta y}{\\delta x}$"},{"id":"6.3","name":"求导公式与法则","full":"求导公式与法则","stage":"高中","one":"$\\left( x ^{ n } \\right) ' = n x ^{ n - 1 } \\text{，} \\left( u v \\right) ' = u ' v + u v '$","what":"每次都用定义求导太麻烦，于是总结出公式：(xⁿ)′＝nxⁿ⁻¹，(sin x)′＝cos x，(eˣ)′＝eˣ，(ln x)′＝1/x……再配上法则：和的导数＝导数的和，乘积、商的求导法则，以及复合函数的链式法则“外层求导乘内层求导”。","next":"有了公式，研究函数的单调性、极值、最值就变成了计算（6.4）；求导的逆运算是积分（6.5、7.3）；解微分方程（7.6）离不开它。","use":"例：(x³)′＝3x²；(sin 2x)′＝2cos 2x。物理里由位移求速度、由速度求加速度，都是逐次求导。","eg":"(x³)′=3x²；(sinx)′=cosx。","from":"公式都是用导数的定义（6.2）一个个推出来的；推的对象是我们熟悉的幂、指数、对数函数（4.3）和三角函数（4.4）；遇到 sin(2x) 这种“函数套函数”，就要按复合函数（3.8）的结构逐层求导。","points":["基本初等函数的导数公式；和、差、积、商的求导法则；复合函数求导。"],"_pyN":"qdgsyfz","_pyX":"$\\left( x ^{ n } \\right) ' = n x ^{ n - 1 } \\text{，} \\left( u v \\right) ' = u ' v + u v '$"},{"id":"6.4","name":"导数的应用","full":"导数的应用：单调性、极值、最值、优化","stage":"高中","one":"$f ' > 0 \\implies \\text{递增；} f ' \\text{变号} \\implies \\text{极值}$","what":"导数是正的，函数就在上升；导数是负的，函数就在下降；导数从正变负的地方是一个“山顶”（极大值），从负变正的地方是“山谷”（极小值）。把山顶、山谷和区间端点的函数值比一比，就得到最大值、最小值。","next":"大学里用中值定理（7.2）严格证明“导数为正则递增”；它是数学建模（8.1）中求最优方案的主要工具。","use":"例：f(x)＝x³−3x，f′(x)＝3x²−3，在 x＝−1 处由正变负，取极大值 2。用料最省的易拉罐、利润最大的定价、路程最短的路线，都是这样求出来的。也用来证明不等式、判断方程根的个数。","eg":"f(x)=x³−3x，f′(x)=3x²−3，在 x=−1 处取极大值 2。","from":"函数的性质（3.2）只告诉我们要研究“增减、最值”，但对复杂函数很难直接判断。导数（6.2）是切线的斜率：斜率为正，图像就在上升；斜率为负，图像就在下降。于是只要看导数的正负就能判断增减；具体算 f′(x) 时用求导公式（6.3）。","points":["f′(x)>0 的区间上函数递增；导数由正变负处取极大值；比较极值与端点值得最值。"],"_pyN":"dsdyydsdyy：ddx、jz、zz、yh","_pyX":"$f ' > 0 \\implies \\text{dz；} f ' \\text{bh} \\implies \\text{jz}$"},{"id":"6.5","name":"定积分","full":"定积分与微积分基本定理","stage":"高中·拓展→大学","one":"$\\displaystyle \\int_a^b f(x)\\,\\mathrm dx=F(b)-F(a)$","what":"求一块曲边图形的面积：把它切成很多细长条，每条近似看成矩形，把矩形面积加起来，再让条越来越细，和的极限就是定积分。神奇的是，算它不用真的去加：只要 f 是连续的，并找到一个函数 F，使 F′(x)＝f(x)，积分就等于 F(b)−F(a)。这就是微积分基本定理——积分和求导互为逆运算。注意：曲线在 x 轴下方的部分，积分算出来是负的，所以积分是“带正负号的面积”。","next":"大学积分学（7.3）发展出各种求原函数的方法和应用；它和求导一起成为解微分方程（7.6）的工具；概率论里，连续型随机变量的概率就是密度曲线下的面积（7.9）。","use":"例：$\\displaystyle \\int_0^1 x^2\\,\\mathrm dx=\\frac13$，即抛物线 $y=x^2$ 在 0 到 1 之间与 x 轴围成的面积。求面积、体积，由速度求路程、由力求做功、计算水坝受到的水压，都是积分。它把“累积”问题变成了“找原函数”的问题。","eg":"$\\displaystyle \\int_0^1 x^2\\,\\mathrm dx=\\frac13$。","from":"长方形、三角形、圆的面积公式（1.6）只能算规则图形；曲线围成的面积要靠“分割、求和、取极限”（6.1）；而微积分基本定理说明，这个累积量可以用求导（6.2）倒过来算。","points":["把区间分割、求和、取极限得到曲边图形的面积；若 $F'(x)=f(x)$，则 $\\displaystyle \\int_a^b f(x)\\,\\mathrm dx=F(b)-F(a)$。"],"_pyN":"djfdjfywjfjbdl","_pyX":"$\\displaystyle \\int_a^b f(x)\\,\\mathrm dx=f(b)-f(a)$"},{"id":"7.2","name":"中值定理·泰勒展开","full":"微分学：中值定理与泰勒展开","stage":"大学","one":"$f \\left( b \\right) - f \\left( a \\right) = f ' \\left( \\xi \\right) \\left( b - a \\right)$","what":"中值定理：一段光滑曲线上，总有一点的切线和连接两端的弦平行——就像开车 1 小时走了 60 公里，只要速度是连续变化的（不会瞬间跳变），途中一定有某一刻速度表正好指在 60。泰勒展开：用多项式去逼近复杂函数，例如 x 很小时 eˣ≈1+x+x²/2，项取得越多越准确。","next":"推广到多个变量就是多元微积分（7.5）；泰勒展开用无穷多项写出来就是幂级数（7.4）；在微分方程的近似求解中大量使用。","use":"计算器算 sin x、eˣ 的数值，靠的就是多项式逼近；工程中“小角度时 sin x≈x”的近似（单摆周期公式）就来自泰勒展开。还能估计近似计算的误差。","eg":"eˣ ≈ 1 + x + x²/2（x 很小时）。","from":"高中用导数判断单调、求极值（6.4）时，“导数为正则递增”是直接接受的；有了严格的极限定义（7.1），就能用中值定理证明它，并进一步用导数把函数“展开”成多项式。","points":["中值定理——曲线上一段弧中总有一点的切线平行于弦；泰勒展开——用多项式逼近函数。"],"_pyN":"zzdl·tlzkwfx：zzdlytlzk","_pyX":"$f \\left( b \\right) - f \\left( a \\right) = f ' \\left( \\xi \\right) \\left( b - a \\right)$"},{"id":"7.7","name":"矩阵与线性方程组","full":"线性代数：矩阵与线性方程组","stage":"大学","one":"$A x = b \\text{：矩阵与线性方程组}$","what":"用一个数表（矩阵）把很多个一次方程写在一起，研究方程组有没有解、有几个解；向量从二维、三维推广到 n 维。例如二元一次方程组可以写成 AX=B 的形式。","next":"线性变换与特征值（7.8）；数据分析、机器学习里的大量计算都建立在它上面。","use":"工程结构受力计算、电路分析、计算机图形学、搜索引擎和人工智能的计算核心。","eg":"二元一次方程组写成矩阵形式 AX=B。","from":"初中的方程组（2.2）一多起来就很难手算，需要统一的方法；把向量（3.3）从平面、空间推广到任意多维，就得到线性代数。","points":["用矩阵表示多个线性方程；判断方程组有没有解、有多少解。"],"_pyN":"jzyxxfczxxds：jzyxxfcz","_pyX":"$a x = b \\text{：jzyxxfcz}$"},{"id":"7.10","name":"大数定律·中心极限定理","full":"大数定律与中心极限定理","stage":"大学","one":"频率 → 概率；和近似正态","what":"大数定律：试验次数越多，事件发生的频率越接近它的概率，平均值越接近期望。中心极限定理：很多个独立的随机因素加在一起，总和近似服从正态分布。例如抛硬币 10000 次，正面的频率会很接近 0.5。","next":"数理统计（7.11）的理论基础：正是因为有这两条定理，才能用样本可靠地推断总体。","use":"保险公司敢于承保：客户越多，总赔付越接近期望值；民意调查只需调查一千多人就能比较准确；解释了身高、误差为什么都近似正态分布。","eg":"抛硬币 10000 次，正面频率很接近 0.5。","from":"最早的版本都是二项分布（5.8）的情形：伯努利证明了独立重复试验中成功的频率趋于概率，棣莫弗和拉普拉斯证明了 n 很大时二项分布接近正态分布。大学用连续型随机变量（7.9）的工具，加上期望与方差（5.7），把它们推广到一般的随机变量。它把高中“频率稳定于概率”的经验事实（5.3）变成了定理。大数定律用期望、方差和切比雪夫不等式证明。","points":["大数定律——试验次数越多，频率越接近概率；中心极限定理——大量独立随机因素之和近似服从正态分布。"],"_pyN":"dsdl·zxjxdldsdlyzxjxdl","_pyX":"pl → gl；hjszt"},{"id":"7.11","name":"数理统计","full":"数理统计：参数估计与假设检验","stage":"大学","one":"置信区间、假设检验","what":"参数估计：用样本推算总体的数值，并给出误差范围（置信区间）；假设检验：先提出一个假设，再看数据是否和它明显矛盾。例如随机调查 1000 人，支持率 52%，按常用的 95% 把握计算，误差约 ±3%。","next":"医学、经济、社会科学、人工智能中一切“用数据得出结论”的研究方法。","use":"新药临床试验判断是否有效；工厂判断一批产品是否合格；选举前的民意调查给出误差范围。","eg":"民调支持率 52%，误差 ±3%。","from":"以大数定律和中心极限定理（7.10）为依据，把高中的抽样估计（5.10）和回归、独立性检验（5.11）发展成能给出误差和可信度的严格方法。","points":["用样本估计总体参数并给出误差范围（置信区间）；用数据判断一个假设是否可信。"],"_pyN":"sltjsltj：csgjyjsjy","_pyX":"zxqj、jsjy"}],"chains":[{"name":"等式与方程","paths":[["1.1.2","2.1.1","2.1.3","2.5.1","4.14"],["2.2.2","7.7.2"]]},{"name":"不等式","paths":[["1.3.3","2.3.1","2.4","2.6.1","2.6.2"],["2.3.1","3.2.1","6.4.1","7.2.1"]]},{"name":"变化与极限","paths":[["0.2.1","3.1.1","6.2.1","6.2.2","6.5.2","7.3","7.6"],["1.4","6.1","6.2.2"],["1.6.2","6.5.1"]]},{"name":"随机与统计","paths":[["0.5.2","5.1.1","5.1.2","5.2.1","5.8.1","7.10.2","7.11.1"]]},{"name":"几何","paths":[["0.6.1","3.3.1","3.3.2","4.5.1","4.8.1"],["4.5.1","4.11.3"],["3.3.4","7.7.1"]]}],"methods":[{"name":"数形结合","desc":"把式子画成图，或把图形写成式子，互相帮助。","nodes":["1.3.2","1.7.2","2.7","3.4","3.9","4.2.2","4.12.6","4.15.1","4.17.1","5.9"]},{"name":"函数与方程","desc":"把问题看成函数（变化），或列成方程（求未知），两者互相转化。","nodes":["2.2.2","2.5.1","3.1.1","4.2.2","4.14","4.17.1","6.4.1","8.1"]},{"name":"分类讨论","desc":"情况不同、结论不同时，按标准分成几类分别处理，不重不漏。","nodes":["1.7.1","2.3.1","2.5.1","2.7","4.2.3","5.1.2","6.4.2"]},{"name":"转化与化归","desc":"把新问题变成已经会解的问题。","nodes":["2.1.3","2.5.1","3.7.1","3.8","4.5.2","4.11.2","4.14","6.5.2"]},{"name":"特殊与一般","desc":"从特例猜规律，再证明一般结论；或用一般结论解决特例。","nodes":["0.4","3.5.1","4.16.1","5.1.2","5.2.2"]},{"name":"有限与无限","desc":"用有限去逼近无限（极限、积分、级数）。","nodes":["1.4","1.6.2","6.1","6.2.2","6.5.1","7.1","7.4"]},{"name":"或然与必然","desc":"在随机中找规律，用概率衡量可能性。","nodes":["3.6.1","5.3.1","5.9","7.10.1","7.11.2"]},{"name":"公理化与演绎","desc":"从少数不证自明的事实出发，逻辑推出全部结论。","nodes":["0.1.1","0.3.1","0.6.1","0.6.2","1.1.1","1.1.2","4.9.1","4.10.3"]}]};
// ── 数据检查（lib/normalize.js）──
// 检查并整理一份知识数据：编号唯一、引用存在、依赖不往高层指、无环、枚举值合法。
// tools/build.mjs 生成网页时和网页打开时都用这一份，保证两处的理解一致。

const KINDS = { 推出: 0, 前提: 1, 推广: 1, 特例: 1, 用到: 2, 对照: 3 };
const TYPES = ["起点", "结论", "中间步"];
const LISTS = ["tags", "conditions", "points", "counterexamples", "notes"];
const PALETTE = ["#607D8B", "#1565C0", "#2E7D32", "#EF6C00", "#C2185B", "#5E35B1", "#00838F", "#6D4C41"];

const str = v => (v === undefined || v === null ? "" : String(v));
const lists = o => {
  const out = {};
  for (const f of LISTS) if (Array.isArray(o[f]) && o[f].length) out[f] = o[f];
  return out;
};

/** 检查并整理：返回 { data, errors, warns }；data 是页面使用的形状（多了 edges、regionColor） */
function normalize(raw) {
  const errors = [], warns = [];
  const title = raw.title || "知识大厦";
  const idp = raw.idPattern || "\\d+\\.\\d{1,2}";
  const idRe = new RegExp(`^(?:${idp})$`);

  const layers = [...(raw.layers || [])].sort((a, b) => a.L - b.L).map(l => ({ L: l.L, name: l.name, sub: l.sub || "" }));
  const layerIds = new Set(layers.map(l => l.L));
  if (!layers.length) errors.push("layers 为空：至少要有一层");

  const regions = (raw.regions || []).map((r, i) => ({
    r: r.name, color: r.color || PALETTE[i % PALETTE.length], desc: r.desc || "",
    ...(r.anchor !== undefined ? { anchor: r.anchor } : {}),
  }));
  const regionNames = new Set(regions.map(r => r.r));
  if (!regions.length) errors.push("regions 为空：至少要有一个区域");

  const nodes = [], seen = new Set();
  for (const n of raw.nodes || []) {
    const nid = str(n.id), where = `知识 ${nid || "(无编号)"}`;
    for (const f of ["id", "name", "layer", "region", "what"])
      if (n[f] === undefined || n[f] === null || n[f] === "") errors.push(`${where}：缺少 ${f}`);
    if (seen.has(nid)) errors.push(`${where}：编号重复`);
    seen.add(nid);
    if (!idRe.test(nid)) warns.push(`${where}：编号不符合 idPattern ${idp}，正文里的（${nid}）不会变成链接`);
    if (!layerIds.has(n.layer)) errors.push(`${where}：layer=${n.layer} 不在 layers 里`);
    if (!regionNames.has(n.region)) errors.push(`${where}：region=${n.region} 不在 regions 里`);
    const deps = [];
    for (const d0 of n.deps || []) {
      const d = typeof d0 === "string" ? { id: d0 } : d0;
      const kind = d.kind || "用到";
      if (!(kind in KINDS)) errors.push(`${where}：依赖 ${d.id} 的 kind=${kind}，只能是 ${Object.keys(KINDS).join("/")}`);
      const dep = { id: str(d.id), kind };
      for (const k of ["how", "method", "condition", "detail"]) if (d[k]) dep[k] = d[k];

// ── 演绎模式：从公理到结论（或反向），分阶段动画播放 ──
let deriveSteps = [], deriveI = 0, derivePhase = 0, derivePlay = true, deriveTimer = 0;
let deriveTarget = "", deriveReverse = false, deriveSession = 0, derivePos = null, deriveAllIds = [];

function buildDeriveSteps(targetId, reverse) {
  const ancestors = new Set([targetId]);
  const q = [targetId];
  for (let i = 0; i < q.length; i++) {
    for (const p of parents[q[i]]) {
      if (!ancestors.has(p)) { ancestors.add(p); q.push(p); }
    }
  }
  const waves = {};
  for (const id of ancestors) { const L = byId[id].layer; (waves[L] = waves[L] || []).push(id); }
  const layerNums = Object.keys(waves).map(Number).sort((a, b) => a - b);
  const steps = [];
  const shown = new Set();
  for (const L of layerNums) {
    const waveNodes = waves[L];
    const edges = [];
    for (const id of waveNodes) {
      for (const d of byId[id].deps) {
        if (shown.has(d.id) && ancestors.has(d.id)) {
          edges.push({ from: d.id, to: id, how: d.how || "", method: d.method || "" });
        }
      }
    }
    if (!edges.length) {
      steps.push({ type: "appear", nodes: waveNodes, edge: null });
    } else {
      for (const e of edges) {
        steps.push({ type: "derive", nodes: [e.to], edge: e });
      }
    }
    waveNodes.forEach(id => shown.add(id));
  }
  return reverse ? steps.slice().reverse().map(s => {
    if (!s.edge) return s;
    return { ...s, edge: { ...s.edge, from: s.edge.to, to: s.edge.from } };
  }) : steps;
}

function startDerive(targetId, reverse) {
  stopTour();
  deriveSession++;
  deriveTarget = targetId;
  deriveReverse = reverse;
  deriveSteps = buildDeriveSteps(targetId, reverse);
  if (!deriveSteps.length) return;
  const allIds = [...new Set(deriveSteps.flatMap(s => s.nodes))];
  deriveAllIds = allIds;
  const WW = Math.max(560, Math.min(1300, VW - (wide() ? 220 : 24)));
  const {B} = makeBands(allIds, WW, null);
  derivePos = simulate(allIds, B, WW, k => N[k].hx / home.W * WW, null);
  setBands(B);
  ALLV.forEach(id => { N[id].ta = 0; });
  mode = "derive"; deriveI = 0; derivePhase = 0; derivePlay = true;
  tip.classList.remove("show");
  deriveAnimate();
}

function deriveAnimate() {
  clearTimeout(deriveTimer);
  const session = deriveSession;
  const step = deriveSteps[deriveI];
  if (!step || mode !== "derive") return;
  const shown = new Set();
  for (let i = 0; i < deriveI; i++) deriveSteps[i].nodes.forEach(id => shown.add(id));

  if (step.type === "appear") {
    step.nodes.forEach(id => shown.add(id));
    ALLV.forEach(id => {
      if (shown.has(id)) { N[id].tx = derivePos[id]?.x || N[id].hx; N[id].ty = derivePos[id]?.y || N[id].hy; N[id].ta = 1; }
      else { N[id].ta = 0; }
    });
    rebuildDeriveEdges(deriveI);
    const names = step.nodes.map(id => byId[id].name).join(", ");
    let head = "<b>" + esc(names) + "</b>";
    if (step.nodes.length === 1) head += "<br>" + formulaHtml(byId[step.nodes[0]].one);
    showDeriveCaption(head);
    if ([...shown].length) fitIds([...shown], 1.2, .4);
    scheduleNext(session, 2500);
    return;
  }

  const e = step.edge;
  if (derivePhase === 0) {
    shown.add(e.from);
    ALLV.forEach(id => {
      if (shown.has(id)) { N[id].tx = derivePos[id]?.x || N[id].hx; N[id].ty = derivePos[id]?.y || N[id].hy; N[id].ta = 1; }
      else { N[id].ta = 0; }
    });
    rebuildDeriveEdges(deriveI);
    const fromName = byId[e.from]?.name || e.from;
    showDeriveCaption("<b>" + esc(fromName) + "</b>" + (e.method ? " 【" + esc(e.method) + "】" : ""));
    fitIds([e.from], 1.1, .5);
    derivePhase = 1;
    scheduleNext(session, 1200);
    return;
  }

  if (derivePhase === 1) {
    shown.add(e.from);
    step.nodes.forEach(id => shown.add(id));
    ALLV.forEach(id => {
      if (shown.has(id)) { N[id].tx = derivePos[id]?.x || N[id].hx; N[id].ty = derivePos[id]?.y || N[id].hy; N[id].ta = 1; }
      else { N[id].ta = 0; }
    });
    ED = [];
    const add = (a, b, color, al, w, flow, arrow) => ED.push({a, b, color, al, w, flow, arrow, ph: hash(a + b)});
    for (let i = 0; i < deriveI; i++) { const s = deriveSteps[i]; if (s.edge) add(s.edge.from, s.edge.to, C.srcBd, 0.4, 1.5, false, true); }
    add(e.from, e.to, C.dstBd, 1, 2.8, true, true);
    fitIds([e.from, e.to], 1.1, .5);

    const fromName = byId[e.from]?.name || e.from;
    const toName = byId[e.to]?.name || e.to;
    let head = "<b>" + esc(fromName) + '</b><span class="ar">→</span><b>' + esc(toName) + "</b>";
    if (e.how) head += "<br>" + formulaHtml(e.how);
    else if (e.method) head += "<br>【" + esc(e.method) + "】";
    showDeriveCaption(head);

    derivePhase = 0;
    const delay = e.how ? Math.min(5000, 2000 + e.how.length * 12) : 2500;
    scheduleNext(session, delay);
    return;
  }
}

function rebuildDeriveEdges(upTo) {
  ED = [];
  const add = (a, b, color, al, w, flow, arrow) => ED.push({a, b, color, al, w, flow, arrow, ph: hash(a + b)});
  for (let i = 0; i < upTo; i++) { const s = deriveSteps[i]; if (s.edge) add(s.edge.from, s.edge.to, C.srcBd, 0.4, 1.5, false, true); }
}

function showDeriveCaption(head) {

  const dirLabel = deriveReverse ? "反向溯源" : "正向演绎";
  setHTML(caption, '<div class="top"><span>' + dirLabel + "：" + esc(byId[deriveTarget]?.name || deriveTarget) + '</span><span class="dots">' + deriveSteps.map((_, i) => '<i class="' + (i <= deriveI ? "on" : "") + '"></i>').join("") + "</span><span>" + (deriveI + 1) + " / " + total + "</span></div>" +

  $("#dPlay").onclick = () => { derivePlay = !derivePlay; if (derivePlay && deriveI === deriveSteps.length - 1) { deriveI = 0; derivePhase = 0; } deriveAnimate(); };

}

function scheduleNext(session, ms) {

    else if (derivePhase === 0) { derivePlay = false; deriveAnimate(); return; }
    deriveAnimate();
  }, ms);
}
