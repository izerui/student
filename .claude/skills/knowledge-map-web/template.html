<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识大厦</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%224%22 width=%2220%22 height=%2224%22 rx=%223%22 fill=%22%231A2433%22/%3E%3Crect x=%2210%22 y=%228%22 width=%2212%22 height=%223%22 fill=%22%23E9AA4C%22/%3E%3Crect x=%2210%22 y=%2214%22 width=%2212%22 height=%223%22 fill=%22%235DBBBE%22/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #F2F4F7; --ink: #1A2433; --muted: #6A7889; --line: #D5DCE5;
    --src: #C77700; --src-bg: #FFF2DC; --src-bd: #E9AA4C;
    --dst: #0F7F86; --dst-bg: #E0F3F2; --dst-bd: #5DBBBE;
    --ease: cubic-bezier(.65, 0, .35, 1);
    --display: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    --body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --mono: "SF Mono", "Menlo", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--body); overflow: hidden; }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--dst); outline-offset: 2px; }
  kbd { font: 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: #fff; }

  header { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: rgba(242,244,247,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); z-index: 10; }
  header h1 { margin: 0; font: 700 23px var(--display); letter-spacing: 6px; cursor: pointer; white-space: nowrap; }
  header .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
  header .tag em { font-style: normal; color: var(--src); font-weight: 600; } header .tag i { font-style: normal; color: var(--dst); font-weight: 600; }
  .grow { flex: 1; }
  .tbtn { height: 34px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; transition: border-color .2s, background .2s; }
  .tbtn:hover { border-color: var(--ink); }
  .tbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #bSearch { width: 230px; color: var(--muted); justify-content: space-between; }

  #bar { position: fixed; top: 56px; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 22px; z-index: 9; white-space: nowrap; overflow-x: auto; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #bar .lead { font-size: 12px; color: var(--muted); background: rgba(242,244,247,.9); padding: 3px 6px; border-radius: 6px; }
  .chip { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
  .chip:hover { border-color: var(--ink); transform: translateY(-1px); }
  .chip.back { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.now { border-color: var(--ink); font-weight: 700; }
  .chip .play { font-size: 9px; margin-right: 5px; color: var(--src); }
  #bar .sep { color: #A9B4C2; font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 2px; margin-right: 4px; }
  .seg button { height: 24px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ink); color: #fff; }
  #legend { position: fixed; left: 18px; bottom: 18px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 520px; font-size: 12px; color: var(--muted); padding: 5px 10px; background: rgba(242,244,247,.9); border-radius: 8px; transition: opacity .3s; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  #cv { position: fixed; top: 56px; left: 0; display: block; touch-action: none; cursor: grab; }
  #cv.grabbing { cursor: grabbing; } #cv.point { cursor: pointer; }
  #formulaLayer { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; z-index: 2; overflow: hidden; pointer-events: none; }
  .canvas-formula { position: absolute; left: 0; top: 0; color: var(--muted); white-space: nowrap; transform-origin: 0 0; will-change: transform, opacity; }
  .canvas-formula .katex { font-size: 12px; line-height: 1; }
  .canvas-formula .katex-display { margin: 0; text-align: left; }

  #mini { position: fixed; right: 64px; bottom: 18px; width: 180px; height: 120px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.85); backdrop-filter: blur(4px); z-index: 5; cursor: crosshair; }
  #zoom { position: fixed; right: 18px; bottom: 18px; z-index: 6; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; box-shadow: 0 4px 14px rgba(26,36,51,.08); }
  #zoom button { width: 34px; height: 34px; border: 0; background: #fff; font-size: 17px; cursor: pointer; color: var(--ink); }
  #zoom button + button { border-top: 1px solid var(--line); }
  #zoom button:hover { background: var(--paper); }
  #help { position: fixed; right: 256px; bottom: 18px; text-align: right; font-size: 11.5px; color: var(--muted); z-index: 5; line-height: 1.8; background: rgba(242,244,247,.85); padding: 2px 8px; border-radius: 8px; }
  #help kbd { margin: 0 2px; }
  #mini, #help { transition: opacity .4s; }
  #mini.hide, #help.gone { opacity: 0; pointer-events: none; }

  #tip { position: fixed; z-index: 20; pointer-events: none; max-width: min(620px, calc(100vw - 40px)); background: var(--ink); color: #fff; font-size: 13px; line-height: 1.7; border-radius: 14px; opacity: 0; transition: opacity .15s; box-shadow: 0 10px 28px rgba(26,36,51,.25); overflow: visible; }
  #tip.show { pointer-events: auto; opacity: 1; }
  #tip .tip-inner { padding: 18px 24px; max-height: calc(100vh - 80px); overflow-y: auto; border-radius: 14px; }
  #tip::after { content: ""; position: absolute; width: 14px; height: 14px; background: var(--ink); transform: rotate(45deg); pointer-events: none; }
  #tip.arrow-left::after { left: -7px; top: var(--arrow-y, 24px); }
  #tip.arrow-right::after { right: -7px; top: var(--arrow-y, 24px); }
  #tip.arrow-top::after { top: -7px; left: 40px; }
  #tip:not(.arrow-left):not(.arrow-right):not(.arrow-top)::after { display: none; }
  #tip.show h3 { color: #B8C3D1; font-size: 11px; letter-spacing: 2px; font-weight: 600; margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); }
  #tip.show p { font-size: 13px; line-height: 1.7; margin: 4px 0; }
  #tip.show .proof { margin: 6px 0 2px; }
  #tip.show .proof-step { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 13px; line-height: 1.8; }
  #tip.show .proof-step:last-child { border-bottom: none; }
  #tip.show .proof-step .sn { width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: rgba(255,255,255,.15); color: #B8C3D1; font: 600 11px var(--mono); flex: none; }
  #tip.show .proof-step .katex { font-size: 1.05em; white-space: nowrap; }
  #tip.show .dep-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.12); }
  #tip.show .dep-block:first-child { margin-top: 4px; padding-top: 0; border-top: none; }
  #tip.show .dep-flow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  #tip.show .dep-flow .lk { font-size: 12px; font-weight: 600; padding: 2px 8px; }
  #tip.show .dep-flow .arrow { color: #5DBBBE; font-size: 14px; }
  #tip.show .dep-src { font-size: 12px; color: #B8C3D1; margin-bottom: 4px; }
  #tip.show .tip-cond { color: #FFD08A; font-size: 12px; margin: 5px 0; padding: 4px 8px; background: rgba(255,208,138,.08); border-radius: 4px; }
  #tip.show .tip-method { color: #5DBBBE; font-weight: 700; font-size: 13px; margin: 5px 0; }
  #tip.show .route { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 12px; margin: 4px 0; }
  #tip.show .route .ar { color: #FFD08A; }
  #tip.show .route .here { background: #fff; color: var(--ink); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 600; }
  #tip.show .lk { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.15); cursor: pointer; color: #fff; margin: 1px 0; }
  #tip.show .lk:hover { background: rgba(255,255,255,.3); }
  #tip.show .hero-formula { margin: 8px 0; padding: 12px 16px; background: rgba(255,255,255,.14); border-left: 3px solid #5DBBBE; border-radius: 0 8px 8px 0; font-size: 15px; }
  #tip.show .hero-formula .katex { font-size: 1.1em; white-space: nowrap; }
  #tip.show .kd { font-size: 10px; padding: 0 4px; border-radius: 3px; background: rgba(255,255,255,.15); }
  #tip.show .md { color: #5DBBBE; font-size: 12px; font-weight: 600; }
  #tip.show { opacity: 1; transform: none; }
  #tip small { color: #B8C3D1; display: block; margin: 2px 0; }
  #tip .rel { color: #FFD08A; display: block; margin-top: 4px; }

  #caption { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 100px); display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(26,36,51,.16); padding: 0; z-index: 12; opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s var(--ease); }
  #caption.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #caption .top { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); padding: 14px 18px 0; flex: none; }
  #caption .dots { display: flex; gap: 5px; }
  #caption .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
  #caption .dots i.on { background: var(--src-bd); }
  #caption .txt { margin: 8px 0 0; font-size: 15px; line-height: 1.7; min-height: 32px; overflow-y: auto; padding: 0 18px; }
  #caption .txt b { font-family: var(--display); font-size: 18px; }
  #caption .txt .ar { color: var(--src); margin: 0 6px; }
  #caption .ctrl { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px 12px; flex: none; }
  #caption .ctrl button { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 12.5px; }
  #caption .ctrl button:hover:not(:disabled) { border-color: var(--ink); }
  #caption .ctrl button:disabled { opacity: .4; cursor: default; }
  #caption .ctrl .main { margin-left: auto; background: var(--ink); color: #fff; border-color: var(--ink); }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  @media (max-width: 900px) {
    }

  #palette { position: fixed; inset: 0; background: rgba(26,36,51,.28); backdrop-filter: blur(2px); z-index: 30; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
  #palette.show { display: flex; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  #palette .box { width: min(560px, calc(100vw - 24px)); background: #fff; border-radius: 16px; box-shadow: 0 30px 80px rgba(26,36,51,.3); overflow: hidden; animation: pop .25s var(--ease); }
  @keyframes pop { from { transform: translateY(-8px) scale(.98); opacity: 0; } }
  #palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 18px 20px; font: 17px var(--body); outline: none; color: var(--ink); }
  #palette .res { max-height: 52vh; overflow-y: auto; padding: 6px; }
  #palette .it { display: grid; grid-template-columns: 42px 1fr auto; gap: 2px 10px; align-items: baseline; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
  #palette .it.act { background: var(--paper); }
  #palette .it .id { font: 11px var(--mono); color: var(--muted); }
  #palette .it b { font-size: 14px; }
  #palette .it small { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
  .fm-script { font-family: var(--body); font-size: .76em; line-height: 0; }
  sup.fm-script { vertical-align: .55em; }
  sub.fm-script { vertical-align: -.18em; }


  #palette .it i { font-style: normal; font-size: 11px; }
  #palette .head { font-size: 11px; color: var(--muted); letter-spacing: 2px; padding: 8px 12px 4px; }
  #palette .foot { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; }

  .splash { position: fixed; inset: 0; overflow-y: auto; padding: 12vh 40px 40px; background: var(--paper); }
  .splash h2 { font: 700 26px var(--display); margin: 0 0 10px; }
  .splash p { font: 15px var(--body); margin: 0 0 14px; }
  .splash ul { font: 13px/1.8 var(--mono); color: #B23B3B; max-width: 900px; }
  #bar .div { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
  #bar .chip.mth { color: var(--dst); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 900px) {
    header { gap: 8px; padding: 0 10px; }
    header h1 { font-size: 19px; letter-spacing: 3px; }
    header .tag, #mini, #help, #legend { display: none; }
    #bSearch { width: auto; flex: 1; }
    #bar { padding: 0 10px; }
    }
</style>
</head>
<body>
<header>
  <h1 id="home" title="回到全景"></h1>
  <div class="tag">点一个知识：<em>琥珀色</em>是它站在哪些知识上，<i>青色</i>是哪些知识站在它上面</div>
  <div class="grow"></div>
  <button class="tbtn" id="bSearch" aria-label="找一个知识">找一个知识… <kbd>/</kbd></button>
</header>
<nav id="bar"></nav>
<canvas id="cv" role="img" aria-label=""></canvas>
<div id="formulaLayer" aria-hidden="true"></div>
<canvas id="mini" aria-hidden="true"></canvas>
<div id="legend"></div>
<div id="zoom"><button id="zIn" title="放大" aria-label="放大">+</button><button id="zOut" title="缩小" aria-label="缩小">−</button><button id="zFit" title="回到合适大小" aria-label="回到合适大小">⤢</button></div>
<div id="help">拖动空白处移动　滚轮或右下角 ＋− 缩放　拖一下卡片试试<br>选中后 <kbd>↓</kbd> 往来源走　<kbd>↑</kbd> 往后续走　<kbd>←</kbd><kbd>→</kbd> 同层换　<kbd>Esc</kbd> 回全景</div>
<div id="caption" aria-live="polite"></div>
<div id="tip"></div>
<div id="palette"><div class="box"><input id="pq" placeholder="输入知识名称，如 导数、概率、向量" autocomplete="off" aria-label="找一个知识"><div class="res" id="pres"></div><div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span></div></div></div>


<script type="module">
import { normalize } from "./lib/normalize.js";
import { formulaRuns, formulaHtml } from "./lib/formula.js";
function setHTML(element, html) {
  const parsed = new DOMParser().parseFromString(`<body>${html}</body>`, "text/html");
  element.replaceChildren(...parsed.body.childNodes);
}
function fail(msg, list) {
  setHTML(document.body, `<div class="splash"><h2>数据没能打开</h2><p>${msg}</p>${list ? `<ul>${list.map(e => `<li>${e.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]))}</li>`).join("")}</ul>` : ""}</div>`);
}
// 数据由 tools/build.mjs 嵌进 window.KMAP_DATA（生成单文件网页时，上面的 import 也会换成 lib/normalize.js 的代码）
const DATA = (() => {
  if (!window.KMAP_DATA) { fail("这是网页模板，不能直接打开：用 tools/build.mjs 把 md（或 JSON）生成单文件网页。"); return null; }
  const {data, errors, warns} = normalize(window.KMAP_DATA);
  warns.forEach(w => console.warn("提醒：" + w));
  if (errors.length) { fail(`数据有 ${errors.length} 处错误`, errors); return null; }
  return data;
})();
if (!DATA) throw new Error("数据没能打开");
const $ = s => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const panelW = () => 0;
const esc = s => (s || "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
// 主稿允许混用 Unicode 上下标和 ^()、^{}、_x、_{}。DOM 与 Canvas 共用 lib/formula.js 的解析结果。
function formulaWidth(c, text, size, family = FONT, weight = "400") {
  let width = 0; for (const r of formulaRuns(text)) { const fs = r.script ? size * .76 : size; c.font = `${weight} ${fs}px ${family}`; width += c.measureText(r.text).width; } return width;
}
function drawFormula(c, text, x, y, size, family = FONT, weight = "400") {
  c.save(); c.textBaseline = "alphabetic"; const base = y + size * .34;
  for (const r of formulaRuns(text)) { const fs = r.script ? size * .76 : size; c.font = `${weight} ${fs}px ${family}`;
    let ry = base;
    if (r.script === "sup") ry -= size * .43;
    else if (r.script === "sub") ry += size * .24;
    c.fillText(r.text, x, ry); x += c.measureText(r.text).width; }
  c.restore(); return x;
}
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif', SERIF = '"Songti SC","STSong","Noto Serif SC",serif';
const REG = DATA.regions.map(r => r.r);
const ANCHOR = {}; DATA.regions.forEach((r, i) => ANCHOR[r.r] = r.anchor ?? (i + .5) / DATA.regions.length);
const IDP = DATA.idPattern || "\\d+\\.\\d{1,2}";
document.title = DATA.title; $("#home").textContent = DATA.title;
$("#cv").setAttribute("aria-label", `${DATA.title}：${DATA.nodes.length} 个知识和它们之间的推导关系。用搜索找到一个知识，查看它的来源和后续。`);
const RC = DATA.regionColor;
const C = {ink: "#1A2433", line: "#D5DCE5", muted: "#6A7889", srcBg: "#FFF2DC", srcBd: "#E9AA4C", srcTx: "#7A4B00", srcFlow: "#D98200",
           dstBg: "#E0F3F2", dstBd: "#5DBBBE", dstTx: "#0B4F53", dstFlow: "#0F8F95", gray: "#8D9BAD"};
const byId = {}; DATA.nodes.forEach(n => byId[n.id] = n);
const parents = {}, children = {};
DATA.nodes.forEach(n => { parents[n.id] = []; children[n.id] = []; });
DATA.edges.forEach(e => { if (e.k === "通向") return; parents[e.b].push(e.a); children[e.a].push(e.b); });
const howOf = {}; DATA.nodes.forEach(n => n.deps.forEach(d => { if (d.how) howOf[d.id + ">" + n.id] = d.how; }));
const LINKS = DATA.edges.filter(e => e.k !== "通向");
const depOf = {}; DATA.nodes.forEach(n => n.deps.forEach(d => depOf[d.id + ">" + n.id] = d));
const RELATION_TAGS = new Set(["前提", "公理", "定义", "定理", "研究对象"]);
const isMethod = m => m && !RELATION_TAGS.has(m);
const edgeLabel = {};
DATA.nodes.forEach(n => n.deps.forEach(d => {
  const key = d.id + ">" + n.id;
  if (isMethod(d.method)) edgeLabel[key] = {parts: [{text: d.method, type: "method"}], color: "#0F7F86"};
}));
const METHODS = DATA.methods || [], methodsOf = id => METHODS.filter(m => (m.nodes || []).includes(id));
const TOOLBOX = DATA.toolbox || [], toolsOf = id => TOOLBOX.filter(t => (t.usedBy || []).includes(id));
const ENTRIES = DATA.entries || [], entriesOf = id => ENTRIES.filter(e => e.targets.some(t => (t.nodes || []).includes(id)));
const conds = id => byId[id].conditions || [], stars = n => "★".repeat(n.importance || 0);
// 分组：同一类的几个知识点。卡片上显示分组名前缀，图上画框；分组编号也能被选中、链接、搜索
const GROUPS = {}; (DATA.groups || []).forEach(g => GROUPS[g.id] = {...g, members: []});
DATA.nodes.forEach(n => { if (n.group && GROUPS[n.group]) GROUPS[n.group].members.push(n.id); });
const gname = id => byId[id] && byId[id].group && GROUPS[byId[id].group] ? GROUPS[byId[id].group].name : "";
const nameOf = id => byId[id] ? byId[id].name : GROUPS[id] ? GROUPS[id].name : id;
const isRef = id => !!(byId[id] || GROUPS[id]);
const FLOORS = [...DATA.layers].sort((a, b) => b.L - a.L);
const hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return ((h >>> 0) % 997) / 997; };
const closure = (id, next) => { const s = new Set(), st = [...next[id]]; while (st.length) { const x = st.pop(); if (!s.has(x)) { s.add(x); st.push(...next[x]); } } return s; };
const wide = () => innerWidth > 900;

const cv = $("#cv"), ctx = cv.getContext("2d"), mini = $("#mini"), mctx = mini.getContext("2d"), tip = $("#tip");
const formulaLayer = $("#formulaLayer"), formulaEls = {}, formulaWidths = {}, formulaHeights = {};
DATA.nodes.forEach(node => {
  if (!node.one) return;

  ED = [];
  const add = (a, b, color, al, w, flow, arrow) => ED.push({a, b, color, al, w, flow, arrow, ph: hash(a + b)});
  for (let i = 0; i < upTo; i++) { const s = deriveSteps[i]; if (s.edge) add(s.edge.from, s.edge.to, C.srcBd, 0.4, 1.5, false, true); }
}

function showDeriveCaption(head) {
  const total = deriveSteps.length;
  const dirLabel = deriveReverse ? "反向溯源" : "正向演绎";
  setHTML(caption, '<div class="top"><span>' + dirLabel + "：" + esc(byId[deriveTarget]?.name || deriveTarget) + '</span><span class="dots">' + deriveSteps.map((_, i) => '<i class="' + (i <= deriveI ? "on" : "") + '"></i>').join("") + "</span><span>" + (deriveI + 1) + " / " + total + "</span></div>" +
    '<div class="txt">' + head + "</div>" +
    '<div class="ctrl"><button id="dPrev" ' + (deriveI ? "" : "disabled") + '>◀ 上一步</button><button id="dPlay">' + (derivePlay ? "❚❚ 暂停" : "▶ 播放") + '</button><button id="dNext" ' + (deriveI < total - 1 ? "" : "disabled") + '>下一步 ▶</button><button class="main" id="dClose">结束</button></div>');
  caption.classList.add("show");
  $("#dPrev").onclick = () => { derivePlay = false; if (derivePhase > 0) { derivePhase = 0; } else { deriveI = Math.max(0, deriveI - 1); derivePhase = 0; } deriveAnimate(); };
  $("#dNext").onclick = () => { derivePlay = false; derivePhase = 0; deriveI = Math.min(deriveSteps.length - 1, deriveI + 1); deriveAnimate(); };
  $("#dPlay").onclick = () => { derivePlay = !derivePlay; if (derivePlay && deriveI === deriveSteps.length - 1) { deriveI = 0; derivePhase = 0; } deriveAnimate(); };
  $("#dClose").onclick = () => { stopTour(); goHome(); showHome(); fitHome(); };
}

function scheduleNext(session, ms) {
  if (!derivePlay) return;
  deriveTimer = setTimeout(() => {
    if (deriveSession !== session || mode !== "derive") return;
    if (derivePhase === 0 && deriveI < deriveSteps.length - 1) { deriveI++; }
    else if (derivePhase === 0) { derivePlay = false; deriveAnimate(); return; }
    deriveAnimate();
  }, ms);
}

// ── 第二行：全景时是主干，选中时是足迹 ──
function drawBar() {
  const bar = $("#bar");
  if (mode === "focus") {
    setHTML(bar, `<button class="chip back" id="bBack">← 全景</button>` +
      trail.map((k, i) => `${i ? '<span class="sep">›</span>' : ""}<button class="chip ${k === sel ? "now" : ""}" data-id="${k}">${esc(nameOf(k))}</button>`).join(""));
    bar.querySelectorAll("[data-id]").forEach(b => b.onclick = () => navTo(b.dataset.id));
  } else if (mode === "tour") {
    setHTML(bar, `<button class="chip back" id="bBack">← 全景</button><span class="lead">正在走主干：${esc(tourName)}</span>`);
  } else {
    const anyType = DATA.nodes.some(n => n.type || (n.conditions || []).length);
    // 主干播放
    setHTML(bar, (DATA.chains.length ? `<span class="lead" title="点一条，从地基一步步播放上去">主干：</span>` + DATA.chains.map((c, i) => `<button class="chip" data-i="${i}" title="点了从地基一步步播放"><span class="play">▶</span>${esc(c.name)}</button>`).join("") : ""));
    setHTML($("#legend"), `${REG.map(r => `<span><i style="background:${RC[r]}"></i>${r}</span>`).join("")}${anyType ? `<span>■ 起点</span><span>● 结论</span><span>○ 中间一步</span><span style="color:var(--src)">◆ 有条件</span>` : ""}`);
    bar.querySelectorAll("[data-m]").forEach(b => {
      const m = METHODS[b.dataset.m];
      b.onmouseenter = () => { methodHi = m; refreshEdges(); };
      b.onmouseleave = () => { methodHi = methodPin === null ? null : METHODS[methodPin]; refreshEdges(); };
      b.onclick = () => showMethod(+b.dataset.m);
    });
    bar.querySelectorAll("[data-i]").forEach(b => {
      b.onmouseenter = () => { chainHi = DATA.chains[b.dataset.i].paths[0]; refreshEdges(); };
      b.onmouseleave = () => { chainHi = null; refreshEdges(); };
      b.onclick = () => { chainHi = null; startTour(+b.dataset.i); };
    });
    const bTool = $("#bToolbox"); if (bTool) bTool.onclick = openToolbox;
    const bEntry = $("#bEntries"); if (bEntry) bEntry.onclick = openEntries;
  }
  const back = $("#bBack"); if (back) back.onclick = navHome;
}

// 工具箱面板：复用 palette 的样式
function renderToolbox() {
  const v = pq.value.trim().toLowerCase(); act = 0;
  const items = v ? TOOLBOX.filter(t => (t.name + (t.formula || "") + (t.source || "") + (t.notes || "")).toLowerCase().includes(v)) : TOOLBOX;
  setHTML(pres, (items.length ? `<div class="head">工具箱 · ${items.length} 个外部工具</div>` : `<div class="head">没有找到</div>`) +
    items.map((t, i) => `<div class="it ${i ? "" : "act"}"><span class="id" style="font-size:10px">${t.source ? esc(t.source) : ""}</span><b>${esc(t.name)}</b><i></i><small>${formulaHtml(t.formula || "")}${t.notes ? "<br><span style='color:var(--muted);font-size:11px'>" + linkParen(t.notes) + "</span>" : ""}${(t.usedBy || []).length ? "<br>用在：" + t.usedBy.filter(k => byId[k]).map(k => `<span class="ref" data-id="${k}" tabindex="0" role="button">${esc(byId[k].name)}</span>`).join(" ") : ""}</small></div>`).join(""));
  pres.querySelectorAll("[data-id]").forEach(a => a.onclick = () => { closePalette(); navTo(a.dataset.id); });
}
function openToolbox() {
  palMode = "toolbox"; pal.classList.add("show"); pq.value = ""; pq.placeholder = "搜索工具箱…";
  renderToolbox(); pq.focus();
}

function renderEntries() {
  const v = pq.value.trim().toLowerCase(); act = 0;
  const items = v ? ENTRIES.filter(e => (e.pattern + e.targets.map(t => t.case + (t.hint || "")).join("")).toLowerCase().includes(v)) : ENTRIES;
  setHTML(pres, (items.length ? `<div class="head">题型入口 · ${items.length} 个</div>` : `<div class="head">没有找到</div>`) +
    items.map((e, i) => `<div class="it ${i ? "" : "act"}" style="cursor:default"><span class="id"></span><b>看到 ${formulaHtml(e.pattern)}</b><i></i><small>${e.targets.map(t => `${formulaHtml(t.case)}：${t.nodes.filter(k => byId[k]).map(k => `<span class="ref" data-id="${k}" tabindex="0" role="button">${esc(byId[k].name)}</span>`).join(" ")}${t.hint ? "<br><span style='color:var(--muted);font-size:11px'>" + formulaHtml(t.hint) + "</span>" : ""}`).join("<br>")}</small></div>`).join(""));
  pres.querySelectorAll("[data-id]").forEach(a => a.onclick = () => { closePalette(); navTo(a.dataset.id); });
}
function openEntries() {
  palMode = "entries"; pal.classList.add("show"); pq.value = ""; pq.placeholder = "搜索题型…";
  renderEntries(); pq.focus();
}

// 方法：点了固定高亮，底部卡片列出说明和用到它的知识
function showMethod(i) {
  if (methodPin === i) { methodPin = null; methodHi = null; caption.classList.remove("show"); drawBar(); refreshEdges(); return; }
  stopTour(); methodPin = i; methodHi = METHODS[i]; const m = methodHi;
  let mBody = `<b>${esc(m.name)}</b>`;
  if (m.direction) mBody += `<br><span style="color:var(--dst)">方向：</span>${linkParen(m.direction)}`;
  if (m.signal) mBody += `<br><span style="color:var(--src)">信号：</span>${linkParen(m.signal)}`;
  if (m.desc) mBody += `<br>${linkParen(m.desc)}`;
  if (m.basis) mBody += `<br><span style="color:var(--muted)">依据：</span>${linkParen(m.basis)}`;
  let mExtra = "";
  if ((m.examples || []).length) mExtra += m.examples.map(e => `<div style="font-size:12.5px;color:var(--dst);margin-top:3px">▸ ${linkParen(e)}</div>`).join("");
  if ((m.pitfalls || []).length) mExtra += m.pitfalls.map(p => `<div style="font-size:12.5px;color:#D64545;margin-top:3px">⚠ ${linkParen(p)}</div>`).join("");
  if ((m.labels || []).length) mExtra += `<div style="font-size:11px;color:var(--muted);margin-top:4px">线上标签：${m.labels.map(l => "【" + esc(l) + "】").join(" ")}</div>`;
  let mNodes = m.nodes.filter(k => byId[k]);
  if (mNodes.length) mExtra += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${mNodes.map(k => `<button data-id="${k}" style="height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px">${esc(byId[k].name)}</button>`).join("")}</div>`;
  setHTML(caption, `<div class="top"><span>方法</span><span>${mNodes.length} 个知识用到</span></div><div class="txt">${mBody}${mExtra}</div>
    <div class="ctrl"><button class="main" id="mClose">收起</button></div>`);
  caption.classList.add("show");
  caption.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { methodPin = null; methodHi = null; navTo(b.dataset.id); });
  $("#mClose").onclick = () => showMethod(i);
  drawBar(); refreshEdges(); fitIds(m.nodes.filter(k => byId[k]), 1.2, .45);
}

// ── 详情卡片（替代右侧面板）──
const lk = id => `<span class="lk" data-id="${id}" tabindex="0" role="button">${GROUPS[id] ? "分组 · " : gname(id) ? `<span style="color:var(--muted)">${esc(gname(id))} > </span>` : ""}${esc(nameOf(id))}</span>`;
const ref = id => `<span class="ref" data-id="${id}" tabindex="0" role="button">${esc(nameOf(id))}</span>`;
const linkParen = s => {
  let t = String(s);
  t = t.replace(/〔[^〕]+〕/g, "");
  t = t.replace(new RegExp("（((?:" + IDP + ")(?:[、，,]\\s*" + IDP + ")*)）", "g"), (m, ids) => {
    const l = ids.split(/[、，,]\s*/).filter(isRef);
    return l.length ? l.map(id => "{{REF:" + id + "}}").join("") : m;
  });
  t = t.replace(/(?<![\\w{:])([A-Za-z]\w*\d+)(?![\\w}])/g, (m, id) => isRef(id) ? "{{REF:" + id + "}}" : m);
  let h = formulaHtml(t);
  h = h.replace(/\{\{REF:([^}]+)\}\}/g, (m, id) => isRef(id) ? ref(id) : id);
  return h;
};
const PLAIN = {"⇐推出": "由", "⇐用到": "用到", "⇐推广": "推广自", "⇐特例": "是这个的特例："};
const linkIds = s => formulaHtml(s).replace(/⇐(推出|用到|推广|特例)\s*/g, m => PLAIN[m.trim()] || "")
  .replace(new RegExp("(?<![\\w.])("+IDP+")(?![\\w])\\s*([^\\s、，；：（）。]*)", "g"), (m, id, w) => {
    if (!isRef(id)) return m; const n = byId[id] || GROUPS[id], dup = w && (n.full.includes(w) || n.name.includes(w) || w.length <= 1);
    return lk(id) + (dup ? "" : " " + w); });
const KIND = {"前提": "以它为前提", "推出": "由它推出", "用到": "用到它", "推广": "由它推广而来", "特例": "是它的特例", "对照": "和它对照着看"};
function routeToBase(id) {
  const prev = {}, q = [id], seen = new Set([id]);
  for (let i = 0; i < q.length; i++) { const x = q[i];
    if (byId[x].layer === 0 && x !== id) { const p = [x]; let y = x; while (prev[y]) { y = prev[y]; p.push(y); } return p; }
    for (const p of parents[x]) if (!seen.has(p)) { seen.add(p); prev[p] = x; q.push(p); } }
  return [id];
}
const relLine = d => {
  const markStep = s => linkParen(s).replace(/【([^】]+)】/g, (m, t) => RELATION_TAGS.has(t) ? `<span style="color:#8D9BAD">【${t}】</span>` : `<span style="color:#5DBBBE;font-weight:600">【${t}】</span>`).replace(/「([^」]+)」/g, '<span style="color:#FFD08A;font-weight:600">「$1」</span>');
  let h = "";
  if (d.condition) h += `<div class="tip-cond">◆ 条件：${formulaHtml(d.condition)}</div>`;
  if (d.how) {
    const steps = d.how.split(/[；;]/).map(s => s.trim()).filter(Boolean);
    if (steps.length > 1) {
      h += `<div class="proof">${steps.map((s, i) => `<div class="proof-step"><span class="sn">${i + 1}</span><span>${markStep(s)}</span></div>`).join("")}</div>`;
    } else {
      h += `<div style="margin:4px 0">${markStep(d.how)}</div>`;
    }
  }
  if (d.detail) h += `<div class="dt">${linkParen(d.detail)}</div>`;
  return h;
};

// ── 搜索面板（三种模式共用同一个弹窗：search 知识搜索、toolbox 工具箱、entries 题型入口）──
const pal = $("#palette"), pq = $("#pq"), pres = $("#pres"); let hits = [], act = 0, palMode = "search";
function openPalette() { palMode = "search"; pal.classList.add("show"); pq.value = ""; pq.placeholder = "输入知识名称，如 导数、概率、向量"; renderHits(); pq.focus(); }
function closePalette() { pal.classList.remove("show"); palMode = "search"; }
function subseqMatch(text, query) {
  let qi = 0;
  for (let ti = 0; ti < text.length && qi < query.length; ti++) if (text[ti] === query[qi]) qi++;
  return qi === query.length;
}
function pyMatch(py, q) {
  if (!py) return 0;
  if (py.includes(q)) return 2;
  let qi = 0;
  for (let ti = 0; ti < py.length && qi < q.length; ti++) if (py[ti] === q[qi]) qi++;
  return qi === q.length ? 1 : 0;
}
function scoreNode(n, v) {
  const q = v.toLowerCase();
  const nameText = (n.id + n.name + (n.full || '') + gname(n.id)).toLowerCase();
  if (nameText.includes(q)) return 10;
  if (subseqMatch(nameText, q)) return 8;
  const pyN = n._pyN || '';
  if (pyN && pyN.startsWith(q)) return 7.5;
  if (pyN && pyN.includes(q)) return 7;
  const namePySeq = pyMatch(pyN, q);
  if (namePySeq) return 5 + namePySeq;
  const oneText = (n.one || '').toLowerCase() + ((n.tags || []).join('')).toLowerCase();
  if (oneText.includes(q)) return 4;
  const extraPy = pyMatch(n._pyX || '', q);
  if (extraPy) return 2 + extraPy;
  const bodyText = ((n.what || '') + (n.points || []).join('') + (n.conditions || []).join('')).toLowerCase();
  if (bodyText.includes(q) || subseqMatch(bodyText, q)) return 1;
  return 0;
}
const GROUP_ITEMS = Object.values(GROUPS).filter(g => g.members.length).map(g => {
  const gd = DATA.groups.find(g2 => g2.id === g.id) || {};
  return {id: g.id, name: g.name, full: g.full, one: g.one, what: g.what, region: byId[g.members[0]].region, isGroup: true, _pyN: gd._pyN || '', _pyX: gd._pyX || ''};
});
function renderHits() {
  const v = pq.value.trim();
  if (!v) hits = (DATA.featured && DATA.featured.length ? DATA.featured : ALL.slice().sort((a, b) => closure(b, children).size - closure(a, children).size).slice(0, 8)).filter(k => byId[k]).map(k => byId[k]);
  else {
    const scored = DATA.nodes.concat(GROUP_ITEMS).map(n => ({n, s: scoreNode(n, v)}))
      .filter(x => x.s > 0).sort((a, b) => b.s - a.s);
    hits = scored.map(x => x.n);
  }
  hits = hits.slice(0, 9); act = 0;
  setHTML(pres, (v ? "" : `<div class="head">常看的知识</div>`) + (hits.length ? hits.map((n, i) => `<div class="it ${i ? "" : "act"}" data-id="${n.id}"><span class="id" style="font-size:10px"></span><b>${n.isGroup ? "分组 · " : gname(n.id) ? `<span style="color:var(--muted);font-weight:400">${esc(gname(n.id))} › </span>` : ""}${esc(n.name)}</b><i style="color:${RC[n.region]}">${n.region}</i><small>${formulaHtml(n.one || "")}</small></div>`).join("")
    : `<div class="head" style="letter-spacing:0">没有找到“${esc(v)}”。换个说法试试，如“导数”“概率”“三角形”</div>`));
  pres.querySelectorAll(".it").forEach((d, i) => { d.onclick = () => { closePalette(); navTo(d.dataset.id); }; d.onmousemove = () => { if (act !== i) { act = i; mark(); } }; });
}
const mark = () => pres.querySelectorAll(".it").forEach((d, i) => { d.classList.toggle("act", i === act); if (i === act) d.scrollIntoView({block: "nearest"}); });
function palInput() {
  if (palMode === "toolbox") renderToolbox();
  else if (palMode === "entries") renderEntries();
  else renderHits();
}
pq.addEventListener("input", palInput);
pq.addEventListener("keydown", e => {
  const items = pres.querySelectorAll(".it");
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && items.length) { e.preventDefault(); act = (act + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length; mark(); }
  if (e.key === "Enter" && items[act]) { items[act].click(); }
  if (e.key === "Escape") closePalette();
});
pal.addEventListener("mousedown", e => { if (e.target === pal) closePalette(); });
$("#bSearch").onclick = openPalette;

// ── 键盘：在家谱里走 ──
addEventListener("keydown", e => {
  if (pal.classList.contains("show")) return;
  if (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape") { tip.classList.remove("show"); if (methodPin !== null) { showMethod(methodPin); return; } if (mode !== "home") navHome(); return; }
  if (mode === "tour" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); tourPlay = false;
    tourI = Math.max(0, Math.min(tourPath.length - 1, tourI + (e.key === "ArrowRight" ? 1 : -1))); tourStep(); return; }
  if (mode !== "focus" || !e.key.startsWith("Arrow") || (e.target.closest && e.target.closest("#detail"))) return;
  e.preventDefault();
  if (GROUPS[sel]) return;
  const o = N[sel], near = list => list.sort((a, b) => Math.abs(N[a].tx - o.tx) - Math.abs(N[b].tx - o.tx))[0];
  let to = null;
  if (e.key === "ArrowDown") to = near([...parents[sel]]);
  if (e.key === "ArrowUp") to = near([...children[sel]]);
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const same = ALL.filter(k => N[k].ta > .5 && byId[k].layer === byId[sel].layer && k !== sel && (e.key === "ArrowLeft" ? N[k].tx < o.tx : N[k].tx > o.tx));
    to = same.sort((a, b) => Math.abs(N[a].tx - o.tx) + Math.abs(N[a].ty - o.ty) - Math.abs(N[b].tx - o.tx) - Math.abs(N[b].ty - o.ty))[0];
  }
  if (to) navTo(to);
});
$("#home").onclick = navHome;

// ── 尺寸 ──
function resize() {
  DPR = devicePixelRatio || 1; VW = innerWidth; VH = innerHeight - 56;
  cv.width = VW * DPR; cv.height = VH * DPR; cv.style.width = VW + "px"; cv.style.height = VH + "px";
  mini.width = 180 * DPR; mini.height = 120 * DPR;
}
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { resize(); computeHome();
  if (mode === "focus") select(sel, true); else if (mode === "tour") { showHome(); tourStep(); } else { showHome(); fitHome(); } }, 150); });

// 操作提示：第一次动手后淡出
const help = $("#help"), hideHelp = () => help.classList.add("gone");
setTimeout(hideHelp, 12000); cv.addEventListener("pointerdown", hideHelp, {once: true});

// ── 开场：一层层从地面升起，盖成大楼 ──
resize(); computeHome(); showHome(); fitHome(); cam = {...camT};
const t0 = performance.now();
ALL.forEach(id => { const o = N[id]; o.x = o.tx; o.y = home.H + 220; o.a = 0; o.delay = reduce ? 0 : t0 + byId[id].layer * 85 + hash(id) * 120; });
for (const L in bands) { bands[L].top = home.H; bands[L].bot = home.H; }
refreshEdges(); drawBar();
requestAnimationFrame(frame);
// ── URL hash 直达：#编号 打开对应知识，浏览器前进后退也能用 ──
const hashId = () => decodeURIComponent(location.hash.slice(1));
const initId = hashId();
if (initId && (byId[initId] || GROUPS[initId])) {
  history.replaceState({id: initId}, "");
  _initTimer = setTimeout(() => select(initId), reduce ? 0 : 800);
}
addEventListener("popstate", () => { clearTimeout(_initTimer); const id = hashId(); if (id && (byId[id] || GROUPS[id])) select(id, true); else if (mode !== "home") goHome(); });
window.kmap = {select, goHome, startTour, formulaRuns, formulaHtml, formulaWidth, get mode() { return mode; }, get sel() { return sel; }, get up() { return up; }, get down() { return down; },
  get ctxSet() { return ctxSet; }, get tourI() { return tourI; }, get cam() { return cam; }, get home() { return home; }, N, byId, GROUPS};
</script>
